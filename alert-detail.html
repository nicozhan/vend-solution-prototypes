<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>告警详情 · VendSolution</title>
<link rel="stylesheet" href="app-ui.css">
<style>
/* 告警详情 · 页面前缀 ad-（只写布局，组件一律用 app-ui.css） */
.ad-badges{flex-wrap:wrap}
.ad-title{margin-top:10px;font-size:19px;line-height:26px;font-weight:800;letter-spacing:-.4px}
.ad-sub{
  margin-top:4px;font-size:11.5px;line-height:16px;color:var(--text-3);
  letter-spacing:.2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere
}
.ad-link{margin-left:6px;font-size:12px;font-weight:600;color:var(--brand);white-space:nowrap}
.ad-ok{color:var(--ok);font-weight:600}
.ad-order{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main class="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <span class="nav-left">
      <a class="icon-btn" href="alerts.html" aria-label="返回告警列表">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
    </span>
    <h1>告警详情</h1>
    <span class="nav-right">
      <a class="icon-btn" href="alerts.html" aria-label="关闭">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </a>
    </span>
  </header>

  <div class="body">

    <!-- 状态头 -->
    <section class="card">
      <div class="card-body">
        <div class="hstack ad-badges">
          <span class="badge lg brand">P2 · 提示</span>
          <span class="badge lg ok"><span class="dot ok"></span>已完成</span>
        </div>
        <h2 class="ad-title">设备离线</h2>
        <p class="ad-sub">设备告警 · DEVICE_OFFLINE · 60e340a2-fe34-4255-9511-2899ffeab032</p>
      </div>
    </section>

    <!-- 基本信息 -->
    <section class="card">
      <div class="card-head"><div class="card-title">基本信息</div></div>
      <div class="card-body tight">
        <div class="rows">
          <div class="row"><dt>设备</dt><dd>SN0010155<a class="ad-link" href="machines.html">查看</a></dd></div>
          <div class="row"><dt>点位</dt><dd>—</dd></div>
          <div class="row"><dt>告警时间</dt><dd>2026/10/25 14:27</dd></div>
          <div class="row"><dt>状态</dt><dd><span class="badge ok">已完成</span></dd></div>
        </div>
      </div>
    </section>

    <!-- 告警信息 -->
    <section class="card">
      <div class="card-head"><div class="card-title">告警信息</div></div>
      <div class="card-body tight">
        <div class="rows">
          <div class="row"><dt>告警类型</dt><dd>设备离线</dd></div>
          <div class="row"><dt>当前状态</dt><dd><span class="ad-ok">正常</span></dd></div>
          <div class="row"><dt>持续时间</dt><dd>7 分钟</dd></div>
        </div>
      </div>
    </section>

    <!-- 关联工单 -->
    <section class="card">
      <div class="card-head bordered">
        <div class="card-title">关联工单</div>
        <span class="badge ok">工单已创建</span>
      </div>
      <a class="item no-thumb" href="app_workorder/ticket-detail.html">
        <span class="item-body">
          <span class="item-name ad-order">WO2114242490149998594</span>
          <span class="item-sub">点击查看工单处理详情</span>
        </span>
        <svg class="item-go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
    </section>

  </div>
</main>
<script src="app-ui.js"></script>
</body>
</html>
