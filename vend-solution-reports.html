function locStatusBadge(s){
  if(s==='ok') return '<span class="badge ok">已翻译</span>';
  if(s==='out') return '<span class="badge warn">待确认</span>';
  if(s==='partial') return '<span class="badge warn">部分</span>';
  return '<span class="badge muted">未翻译</span>';
}
function locItemStatus(it,locale){
  if(locale==='en-US') return 'ok';
  const t=it.tr[locale], o=it.out&&it.out[locale], fields=LOC_FIELDS[it.type];
  let outdated=false; fields.forEach(f=>{ if(o&&o[f]) outdated=true; });
  if(outdated) return 'out';
  let done=0; fields.forEach(f=>{ if(t&&t[f]) done++; });
  if(done===fields.length) return 'ok';
  if(done===0) return 'miss';
  return 'partial';
}
function locTermResolve(map,k,id){
  if(!map) return {v:'(未配置)',fb:false};
  if(LOC.termMiss && id==='PROD_002' && k!=='en'){ if(map.en!==undefined) return {v:map.en,fb:true,fbFrom:'en-US'}; return {v:'(未翻译)',fb:false}; }
  if(map[k]!==undefined) return {v:map[k],fb:false};
  if(map.en!==undefined) return {v:map.en,fb:true,fbFrom:'en-US'};
  return {v:'(未翻译)',fb:false};
}

/* 6.5.2 翻译管理 */
function locTranslate(){
  const tLang=LOC.tLang, q=LOC.q.trim().toLowerCase();
  let items=LOC_ITEMS.filter(it=>{
    if(LOC.entity!=='All' && it.type!==LOC.entity) return false;
    if(q){ const hay=(it.id+' '+it.src.name+' '+((it.tr[tLang]&&it.tr[tLang].name)||'')).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  }).filter(it=>{
    if(LOC.status==='All') return true;
    const s=locItemStatus(it,tLang);
    if(LOC.status==='ok') return s==='ok';
    if(LOC.status==='out') return s==='out';
    if(LOC.status==='miss') return s==='miss'||s==='partial';
    return true;
  });
  const total=items.length;
  const tr=items.filter(it=>locItemStatus(it,tLang)==='ok').length;
  const miss=items.filter(it=>{const s=locItemStatus(it,tLang);return s==='miss'||s==='partial';}).length;
  const out=items.filter(it=>locItemStatus(it,tLang)==='out').length;
  const ov='<div class="loc-grid">'+
    '<div class="loc-ov"><div class="l">总条目</div><div class="v">'+total+'</div><div class="d">当前筛选范围</div></div>'+
    '<div class="loc-ov"><div class="l">已翻译</div><div class="v ok">'+tr+'</div><div class="d">源内容未变化</div></div>'+
    '<div class="loc-ov"><div class="l">缺失 / 部分</div><div class="v muted">'+miss+'</div><div class="d">需补充翻译</div></div>'+
    '<div class="loc-ov"><div class="l">待确认</div><div class="v warn">'+out+'</div><div class="d">源内容已变化</div></div></div>';
  const langOpts=TENANT_LANGS.filter(l=>l.enabled).map(l=>'<option value="'+l.locale+'"'+(l.locale===tLang?' selected':'')+'>'+esc(l.name)+' · '+esc(l.locale)+'</option>').join('');
  const entOpts=[['All','全部类型'],['Product','商品'],['Category','分类'],['Ingredient','原料'],['Option','选项'],['Option Value','选项值'],['Tag','标签']].map(o=>'<option value="'+o[0]+'"'+(o[0]===LOC.entity?' selected':'')+'>'+o[1]+'</option>').join('');
  const stOpts=[['All','全部状态'],['ok','已翻译'],['miss','未翻译'],['out','待确认']].map(o=>'<option value="'+o[0]+'"'+(o[0]===LOC.status?' selected':'')+'>'+o[1]+'</option>').join('');
  const filters='<div class="filterbar"><span class="fitem">语言 <select data-loc-tlang>'+langOpts+'</select></span>'+
    '<span class="fitem">实体类型 <select data-loc-entity>'+entOpts+'</select></span>'+

    '<span class="fitem">搜索 <input data-loc-search value="'+esc(LOC.q)+'" placeholder="按名称 / ID 搜索" style="height:36px;border:1px solid var(--ds-border-input);border-radius:var(--r-sm);padding:0 11px;font-family:inherit;font-size:13px;width:180px"></span>'+
    '<span class="fbar-spacer"></span><span class="fbar-meta">字段级状态 · 不影响业务数据</span></div>';
  const rows=items.map(it=>{
    const s=locItemStatus(it,tLang);
    const t=it.tr[tLang];

function locSaveEdit(id){
  const L=LOC.tLang, it=LOC_ITEMS.find(x=>x.id===id); if(!it) return;
  if(!it.tr[L]) it.tr[L]={}; if(!it.out) it.out={}; if(!it.out[L]) it.out[L]={};
  document.querySelectorAll('[data-loc-field]').forEach(inp=>{ it.tr[L][inp.dataset.locField]=inp.value.trim(); });
  LOC_FIELDS[it.type].forEach(f=>{ it.out[L][f]=false; });
  LOC.edit=null; toast('已保存翻译（'+L+'）');
}
function locWriteProd(){
  const L=LOC.prodLang, k=LOC_KEY[L];
  document.querySelectorAll('[data-prod-input]').forEach(inp=>{
    const parts=inp.dataset.prodInput.split('|'), type=parts[0], code=parts[1], val=inp.value.trim();
    if(type==='prod'){ if(parts[2]==='name') LOC_PROD[code][k]=val; else LOC_PROD_DESC[code][k]=val; }
    else if(type==='cat') LOC_CAT[code][k]=val;
    else if(type==='opt') LOC_OPT[code][k]=val;
    else if(type==='optval') LOC_OPTVAL[code][k]=val;
    else if(type==='tag') LOC_TAG[code][k]=val;
  });
  toast('已保存商品本地化翻译（'+L+'）');
}

function trNow(){
  const d=new Date(), p=function(n){ return String(n).length<2?'0'+n:String(n); };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function trAIText(f,loc){
  const src=String(f.source||'');
  if(f.protect) return src;
  if(loc==='en-US') return src.split('\n').map(function(l){ return TR_AI_DICT[l.trim()]||l.trim(); }).join('\n');
  const pre={'ja-JP':'日本語：','zh-TW':'繁體：','th-TH':'ไทย：'};
  return (pre[loc]||'['+loc+'] ')+src;
}
function trStartAI(mode){
  if(!TR.edit||TR.ai) return;
  const res=trRes(TR.edit.id), loc=TR.target;
  let fields=trFields(res);
  if(mode==='all'){
    fields=fields.filter(function(f){ const r=trRec(res.id,f.key,loc); return !r||!r.v||r.src!=='人工'; });
  }else if(mode.indexOf('sec:')===0){
    const k=mode.slice(4); fields=fields.filter(function(f){ return f.key===k||f.parent===k; });
  }else{
    fields=fields.filter(function(f){ return f.key===mode; });
  }
  if(!fields.length){ toast('没有可翻译的字段'); return; }
  const manual=fields.filter(function(f){ const r=trRec(res.id,f.key,loc); return r&&r.v&&r.src==='人工'; });
  TR.pending=fields.map(function(f){ return f.key; });
  if(manual.length){ TR.confirm={kind:'ai'}; rerender(); return; }
  trAIRun(TR.pending);
}
function trAIRun(keys){
  const res=trRes(TR.edit.id), loc=TR.target;
  TR.ai={keys:keys}; TR.pending=null; TR.confirm=null; rerender();
  setTimeout(function(){
    keys.forEach(function(k){
      const f=trFields(res).find(function(x){ return x.key===k; });
      if(f){ TR.draft[k]=trAIText(f,loc); TR.draftSrc[k]='AI'; }
    });
    TR.ai=null; TR.dirty=true; rerender();
    toast('已完成 '+keys.length+' 个字段的 AI 翻译');
  },650);
}
function trSave(){
  if(!TR.edit) return;
  const res=trRes(TR.edit.id), loc=TR.target;
  let n=0;
  trFields(res).forEach(function(f){
    const k=trKey(res.id,f.key,loc), v=String(TR.draft[f.key]!==undefined?TR.draft[f.key]:'').trim();
    if(v){
      TR_RECORDS[k]={v:v,st:'translated',src:TR.draftSrc[f.key]||'人工',digest:trDigest(f.source),at:trNow()};
      n++;
    }else delete TR_RECORDS[k];
  });
  TR.draft={}; TR.draftSrc={}; TR.dirty=false; rerender(); toast('已保存 '+n+' 条翻译');
}
function trDiscard(){
  TR.draft={}; TR.draftSrc={}; TR.dirty=false; TR.ai=null; rerender(); toast('已放弃未保存的修改');
}
function trFieldHTML(res,f,loc){
  const st=trStatus(res,f,loc), rec=trRec(res.id,f.key,loc);
  const val=TR.draft[f.key]!==undefined?TR.draft[f.key]:(rec&&rec.v?rec.v:'');
  const busy=TR.ai&&TR.ai.keys.indexOf(f.key)>=0;
  const rows=f.multi?3:1;
  return '<div class="tr-field"><div class="tr-label">'+esc(f.label)+(f.hint?' · '+esc(f.hint):'')+'</div>'+
    '<div class="tr-grid"><div class="tr-src">'+esc(f.source)+'</div>'+
    '<div><textarea class="tr-ta" rows="'+rows+'" data-trinput="'+esc(f.key)+'" placeholder="输入译文">'+esc(val)+'</textarea>'+
    '<div class="tr-row">'+trBadge(st)+
    '<button class="btn xs" data-trai="'+esc(f.key)+'"'+(busy?' disabled':'')+'>'+(busy?'翻译中…':'AI 翻译')+'</button>'+
    (st==='outdated'?'<span style="font-size:11px;color:var(--ds-warning-text,#9a3412)">原文已修改</span>':'')+
    (rec&&rec.src==='人工'?'<span style="font-size:11px;color:var(--text-3)">人工</span>':'')+

/* 步骤拖拽排序：折叠行整行可拖，落点插到目标位置 */
let RCP_DRAG=null, CLN_DRAG=null;
document.addEventListener('dragstart',function(e){
  const cl=e.target.closest?e.target.closest('[data-clndrag]'):null;
  const el=cl?null:(e.target.closest?e.target.closest('[data-rcpdrag]'):null);
  if(!cl&&!el) return;
  if(cl){
    CLN_DRAG=Number(cl.dataset.clndrag);
    cl.classList.add('dragging');
    try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(CLN_DRAG)); }catch(err){}
    return;
  }
  RCP_DRAG=Number(el.dataset.rcpdrag);
  el.classList.add('dragging');
  try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(RCP_DRAG)); }catch(err){}
});
document.addEventListener('dragover',function(e){
  const sel=CLN_DRAG!==null?'[data-clndrag]':(RCP_DRAG!==null?'[data-rcpdrag]':null);
  if(!sel) return;
  const el=e.target.closest?e.target.closest(sel):null;
  if(el) e.preventDefault();
});
document.addEventListener('drop',function(e){
  const isCln=CLN_DRAG!==null;
  if(!isCln&&RCP_DRAG===null) return;
  const sel=isCln?'[data-clndrag]':'[data-rcpdrag]';
  const el=e.target.closest?e.target.closest(sel):null;
  const from=isCln?CLN_DRAG:RCP_DRAG;
  const cur=isCln?dcCleanCur():dcRcpCur();
  if(el&&cur){
    e.preventDefault();
    const to=Number(isCln?el.dataset.clndrag:el.dataset.rcpdrag);
    if(to!==from){
      const moved=cur.steps.splice(from,1)[0];
      cur.steps.splice(to,0,moved);
      if(isCln) DC.cln.open=to; else DC.rcp.open=to;
      rerender();
    }
  }
  RCP_DRAG=null; CLN_DRAG=null;
});
document.addEventListener('dragend',function(){
  RCP_DRAG=null; CLN_DRAG=null;
  const d=document.querySelector('.rcp2-step.dragging');
  if(d) d.classList.remove('dragging');
});

/* 型号 × 组件实例：一台硬件一行 [型号, 组件, 控制编码]
   同一个组件装几台就有几行，控制编码各不相同（cmd_stir1 / cmd_stir2 …） */
const DC_CMD_BASE={'C-BREW':'cmd_brew','C-MIXL':'cmd_stir','C-GRIND':'cmd_grind','C-DISP':'cmd_disp',
  'C-CUPBIN':'cmd_cup_bin','C-LIDBIN':'cmd_lid_bin','C-WATER':'cmd_water',
  'C-VMIX':'cmd_vmix','C-FLOW':'cmd_flow','C-AIR':'cmd_air','C-LIFT':'cmd_lift',
  'C-MILK':'cmd_milk','C-ICE':'cmd_ice'};
function dcDefaultCmd(cid){ return DC_CMD_BASE[cid]||('cmd_'+String(cid||'').replace(/^C-/,'')); }
let DC_LINK=[];
(function(){
  /* [型号, 组件, 台数] —— 台数 >1 时按 base+序号 生成独立控制编码 */
  [['M-WSD1008I','C-BREW',1],['M-WSD1008I','C-MIXL',3],['M-WSD1008I','C-GRIND',1],
   ['M-WSD1008I','C-DISP',6],['M-WSD1008I','C-CUPBIN',1],['M-WSD1008I','C-LIDBIN',1],
   ['M-WSD1008I','C-WATER',1],['M-WSD1008I','C-LIFT',2],
   ['M-SMOODER1','C-VMIX',1],['M-SMOODER1','C-FLOW',1],['M-SMOODER1','C-AIR',1]
  ].forEach(function(seed){
    var base=dcDefaultCmd(seed[1]), n=seed[2];
    for(var i=1;i<=n;i++) DC_LINK.push([seed[0],seed[1],base+(n>1?String(i):'')]);
  });
})();
/* 真机 BOM 补齐：1008 是双豆仓 + 鲜奶路 + 制冰；Smooder 有进水与升降
   （不重排已有实例，控制编码不变，23 张配方里的 cmd_grind 仍然有效） */
(function(){
  function after(mid,cmd,row){
    var pos=-1;
    DC_LINK.forEach(function(l,i){ if(l[0]===mid&&l[2]===cmd) pos=i; });
    DC_LINK.splice(pos<0?DC_LINK.length:pos+1,0,row);
  }
  after('M-WSD1008I','cmd_grind',['M-WSD1008I','C-GRIND','cmd_grind2']);
  after('M-WSD1008I','cmd_water',['M-WSD1008I','C-MILK','cmd_milk']);
  after('M-WSD1008I','cmd_milk',['M-WSD1008I','C-ICE','cmd_ice']);
  DC_LINK.push(['M-SMOODER1','C-WATER','cmd_water'],['M-SMOODER1','C-LIFT','cmd_lift']);
})();
/* 每台硬件实例的 ID：vs + 5 位序号，全站唯一、创建后不变
   数组下标 3 = 实例 ID，和「控制编码」一样属于这台硬件本身 */
let DC_INST_SEQ=1234;
function dcNewInstId(){ return 'vs'+String(DC_INST_SEQ++).padStart(5,'0'); }
function dcInstId(l){ if(!l) return ''; if(!l[3]) l[3]=dcNewInstId(); return l[3]; }
DC_LINK.forEach(dcInstId);
function dcInstsOf(mid,cid){ return DC_LINK.filter(function(l){ return l[0]===mid&&(!cid||l[1]===cid); }); }
function dcLinkOf(mid,cid){ return dcInstsOf(mid,cid)[0]; }
function dcQtyOf(mid,cid){ return dcInstsOf(mid,cid).length; }
function dcInstCount(mid){ return dcInstsOf(mid).length; }
function dcNextCmd(mid,cid){
  var base=dcDefaultCmd(cid);
  /* 同一型号下控制编码不能重复，所以拿全型号的编码排重 */
  var used=DC_LINK.filter(function(l){ return l[0]===mid; }).map(function(l){ return l[2]; });
  var same=dcInstsOf(mid,cid).map(function(l){ return l[2]; });
  if(!same.length&&used.indexOf(base)<0) return base;
  /* 已有 base / base2 / base3 … 就顺着最大的序号加一台 */
  var max=0;
  used.forEach(function(cmd){
    if(String(cmd).indexOf(base)!==0) return;
    var s=String(cmd).slice(base.length);
    if(s===''){ max=Math.max(max,1); return; }
    if(/^\d+$/.test(s)) max=Math.max(max,Number(s));
  });
  if(max===0&&used.indexOf(base)<0) return base;
  var n=Math.max(max+1,2);
  while(used.indexOf(base+n)>=0) n++;
  return base+n;
}

/* 参数优先取这台实例（实例级），传组件编码时退回该型号的第一台 */
function dcTplParams(mid,key){
  if(!key) return [];
  var l=dcInstByCmd(mid,key)||DC_LINK.filter(function(x){ return x[0]===mid&&x[1]===key; })[0];
  var cid=l?l[1]:key, cmd=l?l[2]:'';
  var ps;
  if(cmd){ ps=dcInstPts(mid,cmd); }
  else{
    ps=(PARAM_REG[cid]||[]).map(function(p){
      return {c:p.code,code:p.code,n:p.name,u:p.u,t:p.t,type:p.t,min:p.min,max:p.max,
        st:p.st,d:p.def,vals:p.vals,scope:p.scope,src:p.src};
    });
  }
  ps=ps.filter(function(p){ return p.scope!=='comp'; });
  var allow=(TPL_P_MODEL[mid]||{})[cid];
  if(allow) ps=ps.filter(function(p){ return allow.indexOf(p.c)>=0; });
  return ps;
}
/* 实例名对齐真机：豆仓 A/B、粉料仓 1…6、搅拌器 1…3 */
function dcTplInstName(mid,cmd){
  var l=dcInstByCmd(mid,cmd); if(!l) return cmd;
  var c=dcCompOf(l[1]); if(!c) return cmd;
  var sibs=dcInstsOf(mid,l[1]), idx=0;
  sibs.forEach(function(x,i){ if(x[2]===cmd) idx=i; });
  if(c.id==='C-GRIND') return '豆仓 '+String.fromCharCode(65+idx);
  if(c.id==='C-DISP')  return '粉料仓 '+(idx+1);
  if(c.id==='C-MIXL')  return '搅拌器 '+(idx+1);
  if(c.id==='C-LIFT')  return '升降机构'+(sibs.length>1?(' '+(idx+1)):'');
  return c.name+(sibs.length>1?(' 第'+(idx+1)+'台'):'');
}
/* 按当前 BOM 生成/同步模板：新增的实例自动补进来，卸掉的自动移除，已停用的参数保持 */
function dcTplEnsure(mid){
  var M=dcTplModel(mid);
  var t=DC_TPL[mid]||(DC_TPL[mid]={cats:{},acts:[]});
  TPL_CAT.forEach(function(cd){
    var old=t.cats[cd.k]||[], next=[];
    ((M.cats||{})[cd.k]||[]).forEach(function(cid){
      dcInstsOf(mid,cid).forEach(function(l){
        var keep=null;
        for(var i=0;i<old.length;i++) if(old[i].cmd===l[2]&&!old[i].__used){ keep=old[i]; old[i].__used=1; break; }
        if(keep){ keep.cid=cid; next.push(keep); }
        else next.push({cid:cid,cmd:l[2],use:1,on:dcTplParams(mid,l[2]).map(function(p){ return p.c; })});
      });
    });
    old.forEach(function(o){ delete o.__used; });
    /* 手动重复引用的条目（同一台硬件在模板里出现多次）保留 */
    old.forEach(function(o){
      if(o.dup && next.some(function(n){ return n.cmd===o.cmd; })) next.push(o);
    });
    t.cats[cd.k]=next;
  });
  var acts=[];
  (M.acts||[]).forEach(function(k){
    var keep=null;
    for(var i=0;i<t.acts.length;i++) if(t.acts[i].k===k&&!t.acts[i].__used){ keep=t.acts[i]; t.acts[i].__used=1; break; }
    acts.push(keep||{k:k,use:1,on:(TPL_ACT[k]?TPL_ACT[k].p:[]).map(function(p){ return p.c; })});
  });
  t.acts.forEach(function(o){ delete o.__used; });
  t.acts=acts;
  return t;
}

/* 这个组件在这套程序下能配的参数 */
function dcWashParams(comp,plan,mid,cmd){
  if(!comp) return [];
  if(comp.id==='C-LIFT'){
    const part=dcWashPartOf(mid,cmd), deep=!!(plan&&plan.kind==='深度');
    return dcWashLiftSet(part,deep).map(function(f){
      return {k:f.k,code:f.k,l:f.l,t:'num',u:f.u,min:f.min,max:f.max,def:f.def};
    });
  }
  const pre=DC_WASH_CODE[comp.id]||'wash';
  return dcCleanFields(comp).map(function(f){
    return {k:f.k,code:pre+'_'+f.k,l:f.l,t:f.t||'num',u:f.u,min:f.min,max:f.max,opts:f.opts,def:''};
  });
}
/* 新加组件时的初值：能复用的旧值先复用 */
function dcWashDefaults(comp,plan,mid,cmd){
  const d={}, seed=DC_CLEAN_SEED[comp?comp.id:'']||{};
  dcWashParams(comp,plan,mid,cmd).forEach(function(f){
    let v=seed[f.k];
    if(v==null) v=f.def!=null?f.def:(f.t==='sel'?((f.opts||[])[0]||''):'');
    d[f.k]=String(v);
  });
  return d;
}
/* 切日常/深度后：同名字段留住旧值，其余回到默认 */
function dcCleanReparam(plan){
  plan.steps.forEach(function(st){

    const next=dcWashDefaults(c,plan,plan.mid,st.cmd), old=st.p||{}, merged={};
    Object.keys(next).forEach(function(k){
      merged[k]=(old[k]!==undefined&&old[k]!=='')?old[k]:next[k];
    });
    st.p=merged;
  });
}

  fr.onload=function(){
    const im=new Image();
    im.onload=function(){
      const w=im.naturalWidth,h=im.naturalHeight,side=Math.min(w,h);
      if(!side){ toast('图片读取失败'); return; }
      const out=Math.min(side,512), cv=document.createElement('canvas');
      cv.width=out; cv.height=out;
      cv.getContext('2d').drawImage(im,(w-side)/2,(h-side)/2,side,side,0,0,out,out);
      DC.edit.img=cv.toDataURL('image/png');
      rerender(); toast('图片已裁切为 1:1 方形');
    };
    im.onerror=function(){ toast('图片读取失败'); };
    im.src=fr.result;
  };

function dcWizNext(){
  const w=DC.wiz; if(!w) return;
  if(w.step===1){
    const bs=document.querySelector('[data-dcwizbrand]'), ns=document.querySelector('[data-dcwizname]');
    if(bs) w.brand=bs.value;
    if(ns) w.name=ns.value.trim();
    if(!w.brand){ toast('请先选择品牌'); return; }
    if(!w.name){ toast('请填写型号名称'); return; }
    if(dcDup('model',w.name,null,w.brand)){ toast('该品牌下已有同名型号'); return; }
    w.step=2;
  }else if(w.step===2){
    if(!w.rows.length){ toast('至少添加一个组件'); return; }
    w.rows.forEach(function(r){ r.qty=Math.max(1,Math.min(99,Number(r.qty)||1)); });
    w.step=3;
  }
  rerender();
}
function dcWizCreate(){
  const w=DC.wiz; if(!w) return;
  if(!w.name){ toast('请填写型号名称'); return; }
  if(dcDup('model',w.name,null,w.brand)){ toast('该品牌下已有同名型号'); return; }
  const mid=dcNewId('M'), today=todayStr();
  DC_MODEL.push({id:mid,brand:w.brand,name:w.name,created:today,updated:today});
  w.rows.forEach(function(r){
    var n=Math.max(1,Number(r.qty)||1), base=dcDefaultCmd(r.cid);
    for(var i=1;i<=n;i++) DC_LINK.push([mid,r.cid,base+(n>1?String(i):'')]);
  });
  const nm=w.name;
  DC.expBrands[w.brand]=true; DC.wiz=null; DC.mTab='comp'; DC.drawer={kind:'model',id:mid};
  rerender(); toast('型号「'+nm+'」已创建');
}

function dcPointRangeText(pt){
  if(pt.type==='value'){
    const seg=[];
    if(pt.min!=='') seg.push(pt.min);
    if(pt.max!=='') seg.push('~'+pt.max);
    const u=pt.unit?' '+pt.unit:'';
    return (seg.length?seg.join(' '):'—')+u;
  }
  if(pt.type==='enum') return (pt.enumVals||[]).join(' / ')||'—';
  return '—';
}
function dcPointDefaultText(pt){
  if(pt.type==='bool') return pt.def==='true'?'开（true）':(pt.def==='false'?'关（false）':'—');
  if(pt.def===''||pt.def==null) return '—';
  return pt.def;
}

function dcConfirmModal(){
  const c=DC.confirm;
  let title='',body='',risk='',footer='',warn=false;
  if(c.kind==='brand'){
    const b=DC_BRAND.find(x=>x.id===c.id); if(!b) return '';
    title='无法删除品牌'; warn=true;
    body='品牌「<b>'+esc(b.name)+'</b>」下还有 <b>'+dcBrandModelCount(b.id)+'</b> 个型号，删除会丢失这些型号的配置。';
    risk='请先把这些型号删除或转移到其它品牌，再删除该品牌。';
    footer='<button class="btn accent" data-dcclose>知道了</button>';
  }else if(c.kind==='component'){
    const comp=dcCompOf(c.id); if(!comp) return '';
    title='无法删除组件'; warn=true;
    body='组件「<b>'+esc(comp.name)+'</b>」已被 <b>'+dcCompModelCount(c.id)+'</b> 个型号使用。';
    risk='请先在对应型号里解除适配关系，再删除该组件。';
    footer='<button class="btn accent" data-dcclose>知道了</button>';
  }else if(c.kind==='inst'){
    const l=DC_LINK[c.idx]; if(!l) return '';
    const comp=dcCompOf(l[1]);
    const names=[];
    DC_RECIPE.forEach(function(r){
      if(r.mid!==l[0]) return;
      const hit=r.steps.some(function(st){
        const sl=st.slots||{};
        for(const k in sl){ if(sl[k].cmd===l[2]) return true; }
        return false;
      });
      if(hit&&names.indexOf(r.name)<0) names.push(r.name);
    });
    const used=dcInstUsed(l[0],l[2]);
    title='移除这台组件';
    body='确定把「<b>'+esc(comp?comp.name:l[1])+'</b> · <code>'+esc(l[2])+'</code>」从型号里移除？'+
      (used?('有 <b>'+used+'</b> 个配方步骤在用它（'+esc(names.slice(0,3).join('、'))+(names.length>3?' 等':'')+'），确认后这些步骤会被一并清掉。'):'当前没有配方引用它，移除后不影响配方。');
    risk='此操作不可恢复。';
    footer='<button class="btn" data-dcclose>取消</button><button class="btn danger" data-dcconfirm>移除'+(used?'并清理':'')+'</button>';
  }else if(c.kind==='brandDel'){
    const b=DC_BRAND.find(x=>x.id===c.id); if(!b) return '';
    title='删除品牌';
    body='确定删除品牌「<b>'+esc(b.name)+'</b>」？该品牌下已经没有型号。';
    risk='此操作不可恢复。';
    footer='<button class="btn" data-dcclose>取消</button><button class="btn danger" data-dcconfirm>确认删除</button>';
  }else if(c.kind==='compDel'){
    const comp=dcCompOf(c.id); if(!comp) return '';
    title='删除组件';
    body='确定删除组件「<b>'+esc(comp.name)+'</b>」？它已经不在任何型号里使用，删除后参数定义一并失效。';
    risk='此操作不可恢复。';
    footer='<button class="btn" data-dcclose>取消</button><button class="btn danger" data-dcconfirm>确认删除</button>';
  }else{
    const m=dcModelOf(c.id); if(!m) return '';
    const n=DC_LINK.filter(l=>l[0]===m.id).length;
    title='删除型号';
    body='确定删除型号「<b>'+esc(dcModelLabel(m))+'</b>」？会一并清理 <b>'+n+'</b> 条组件关联记录；全局组件资料保留。';
    risk='此操作不可恢复。';
    footer='<button class="btn" data-dcclose>取消</button><button class="btn danger" data-dcconfirm>确认删除</button>';
  }
  const ic=warn?'<div class="dc-confirm-ic warn">!</div>':'<div class="dc-confirm-ic">!</div>';
  return '<div class="mx-mask" data-dcmask><div class="mx w620">'+
    '<div class="mx-hd"><div><h3>'+title+'</h3></div><button class="mx-x" data-dcclose aria-label="关闭" title="关闭">×</button></div>'+
    '<div class="mx-bd"><div class="dc-confirm">'+ic+
      '<div class="dc-confirm-bd">'+body+(risk?'<div class="dc-confirm-risk">'+risk+'</div>':'')+'</div>'+
    '</div></div>'+
    '<div class="mx-ft">'+footer+'</div></div></div>';
}

/* 组件 → 品牌分组（抽屉按品牌分页，一个品牌的所有型号放在同一页） */
function dcBrandGroupsOf(cid){
  var groups=[];
  dcModelsOf(cid).forEach(function(m){
    var g=groups.filter(function(x){ return x.bid===m.brand; })[0];
    if(!g){ g={bid:m.brand,name:dcBrandName(m.brand),models:[]}; groups.push(g); }
    g.models.push(m);
  });
  return groups;
}
function dcFmtRange(f){
  if(f.t==='num'){
    if(f.min===''||f.max===''||f.min==null||f.max==null) return '待定';
    return f.min===f.max?('固定 '+f.min):(f.min+' – '+f.max);
  }
  if(f.o&&f.o.length) return f.o.join(' / ');
  return '—';
}
/* 组件参数的范围文案：预制冲泡量 0–200 ml / 预浸泡时间 0–25.5 s */
function dcPointSpec(p){
  var t=p.type||'value';
  if(t==='bool') return '开关';
  if(t==='enum') return (p.enumVals&&p.enumVals.length)?p.enumVals.join(' / '):'—';
  if(t==='string') return '文本';
  if(t==='raw') return '透传';
  var u=p.unit?(' '+p.unit):'';
  if(p.min===''&&p.max==='') return '待定';
  if(String(p.min)===String(p.max)) return '固定 '+p.min+u;
  return p.min+'–'+p.max+u;
}
function dcInstParamBox(c,mid,cmd){
  var pts=(mid&&cmd)
    ?dcInstPts(mid,cmd).filter(function(p){ return p.scope!=='rcp'&&p.on; })
    :((c&&c.points)?c.points.filter(function(p){ return p.enabled!==false; }):[]);
  if(!pts.length) return '<div class="pp-none">这台组件没有可调参数。</div>';
  return '<div class="pp">'+pts.map(function(p){
    var chg=(p.lib&&(String(p.min)!==String(p.lib.min)||String(p.max)!==String(p.lib.max)))

function dcSlotDef(k){ for(var i=0;i<DC_SLOT.length;i++) if(DC_SLOT[i].k===k) return DC_SLOT[i]; return null; }

/* 型号抽屉 · Tab2：上层「配方模板」，下层「饮品配方」 */

function dcRcpNav(d){

function dcStepAdd(){
  const cur=dcRcpCur(), d=DC.drawer; if(!cur||!d) return;
  const kinds=DC_SLOT.filter(function(x){ return dcSlotAvail(d.id,x.k).length; });
  if(!kinds.length){ toast('这个型号还没有组件，先去组件 Tab 加'); return; }
  /* 优先开一张「放料」卡；料仓都用过了就沿用上一次的槽位类型 */
  const cnt={};
  cur.steps.forEach(function(st){ DC_SLOT.forEach(function(x){ if(st.slots&&st.slots[x.k]) cnt[x.k]=(cnt[x.k]||0)+1; }); });
  const silo=kinds.filter(function(x){ return x.k==='silo'; })[0];
  const k=(silo||kinds[0]).k;
  const sl=dcSlotAdd(cur.steps, d.id, k);
  cur.steps.push({slots:{}});

/* 往某一步加一个槽位；优先选配方里还没用到的那一台 */
function dcSlotAdd(steps, mid, k){
  const pool=dcSlotAvail(mid,k);
  if(!pool.length) return null;
  const used={};
  steps.forEach(function(st){ if(st.slots&&st.slots[k]) used[st.slots[k].cmd]=1; });
  const pick=pool.filter(function(l){ return !used[l[2]]; })[0]||pool[0];
  return {cmd:pick[2]};
}
function dcStepDel(i){
  const cur=dcRcpCur(); if(!cur) return;

function dcStepMove(i,dd){

  const j=i+dd; if(j<0||j>=cur.steps.length) return;
  const t=cur.steps[i]; cur.steps[i]=cur.steps[j]; cur.steps[j]=t;
  if(DC.rcp.open===i) DC.rcp.open=j; else if(DC.rcp.open===j) DC.rcp.open=i;
  rerender();
}
/* 再加装一台同型号组件：控制编码自动顺延，物理上插回同类那几行后面 */
function dcInstBlockEnd(mid,cid){
  let pos=-1;
  DC_LINK.forEach(function(l,i){ if(l[0]===mid&&l[1]===cid) pos=i; });
  return pos<0?DC_LINK.length:pos+1;
}
function dcAddInst(idx){
  const l=DC_LINK[idx]; if(!l) return;
  const mid=l[0], cid=l[1], c=dcCompOf(cid);
  const cmd=dcNextCmd(mid,cid);
  DC_LINK.splice(dcInstBlockEnd(mid,cid),0,[mid,cid,cmd]);
  dcBayAttach(mid,cid,cmd);
  rerender(); toast('已加装 1 台 '+(c?c.name:'组件')+' · 控制编码 '+cmd);
}
/* 移除一台。被配方引用时不直接删，弹窗说明影响后再确认 */
function dcInstUsed(mid,cmd){
  let n=0;
  DC_RECIPE.forEach(function(r){
    if(r.mid!==mid) return;
    r.steps.forEach(function(st){
      const sl=st.slots||{};
      for(const k in sl){ if(sl[k].cmd===cmd) n++; }
    });
  });
  return n;
}
function dcRemoveInst(idx){
  const l=DC_LINK[idx]; if(!l) return;
  const used=dcInstUsed(l[0],l[2]);
  if(used){ DC.confirm={kind:'inst',idx:idx}; rerender(); return; }
  DC_LINK.splice(idx,1);
  dcBayDetach(l[0],l[2]);
  rerender(); toast('已移除 1 台 · '+l[2]);
}
/* ============================================================
   型号抽屉 · Tab2：料仓（一仓一行，同类仓可以重复加）
   仓位 = 机器上的一个储料位；一仓最多绑定这台机器的一台同类硬件
   ============================================================ */
const DC_BAY_TYPE=[
  {k:'bean',  n:'咖啡豆仓', s:'豆', cap:'1.2 kg', v:1.2,u:'kg', cats:['咖啡豆仓'], hint:'磨豆出粉'},
  {k:'powder',n:'粉料仓',  s:'粉', cap:'4.3 L',  v:4.3,u:'L',  cats:['粉料仓'],   hint:'螺旋出料'},
  {k:'water', n:'水',      s:'水', cap:'8 L',    v:8,  u:'L',  cats:['水'],       hint:'冷水 / 温水 / 热水'},
  {k:'ice',   n:'冰',      s:'冰', cap:'3 kg',   v:3,  u:'kg', cats:['冰'],       hint:'冰块，无出料机构'},
  {k:'cup',   n:'杯子',    s:'杯', cap:'100 个', v:100,u:'个', cats:['杯子'],     hint:'落杯'},
  {k:'lid',   n:'盖子',    s:'盖', cap:'100 个', v:100,u:'个', cats:['杯盖'],     hint:'落盖'}
];
/* 仓位按用途分三组：料仓（咖啡/粉料）、水冰、耗材（杯/盖） */
const DC_BAY_GROUP=[
  {k:'stock', n:'料仓',  ts:['bean','powder']},
  {k:'water', n:'水 / 冰', ts:['water','ice']},
  {k:'consum',n:'耗材',  ts:['cup','lid']}
];
function dcBayType(k){
  for(var i=0;i<DC_BAY_TYPE.length;i++) if(DC_BAY_TYPE[i].k===k) return DC_BAY_TYPE[i];
  return DC_BAY_TYPE[0];
}
function dcBaySort(){
  const ord={}; DC_BAY_TYPE.forEach(function(t,i){ ord[t.k]=i; });
  DC_BAY.sort(function(a,b){ return ord[a.k]-ord[b.k]; });
}
/* 仓位现在带实体字段：容量、单位、缺料阈值、当前物料（导出与补货都用它） */
function dcBayNew(mid,k,cmd){
  const t=dcBayType(k);
  return {mid:mid,k:k,cmd:cmd||'',capV:t.v,unit:t.u,warn:20,mat:''};
}
let DC_BAY=[];
(function(){
  /* 初始：型号已装的料仓类硬件各占一个仓位 */
  DC_LINK.forEach(function(l){
    const c=dcCompOf(l[1]); if(!c) return;
    /* 流量计、气泵是管路器件，不占仓位 */
    if(c.id==='C-FLOW'||c.id==='C-AIR') return;
    const t=DC_BAY_TYPE.filter(function(x){
      return x.cats.some(function(n){ return dcHasCat(c,n); });
    })[0];
    if(!t) return;
    DC_BAY.push(dcBayNew(l[0],t.k,l[2]));
  });
  /* 冰路由 C-ICE 实例自动生成仓位，见下方 DC_LINK 真机 BOM 补齐 */
  dcBaySort();
})();
function dcBayList(mid){ return DC_BAY.filter(function(b){ return b.mid===mid; }); }
/* 仓位名：同类只有一个就不带序号（水 / 杯子），多个才编号（粉料仓 1…6） */
function dcBayRows(mid){
  const list=dcBayList(mid), tot={}, seq={};
  list.forEach(function(b){ tot[b.k]=(tot[b.k]||0)+1; });
  return list.map(function(b){
    seq[b.k]=(seq[b.k]||0)+1;
    const t=dcBayType(b.k);
    return {b:b,t:t,name:t.n+(tot[b.k]>1?(' '+seq[b.k]):'')};
  });
}
function dcBaySameComp(c,t){
  return t.cats.some(function(n){ return dcHasCat(c,n); });
}
function dcBayFreeCmd(mid,t,skip){
  const used={};
  dcBayList(mid).forEach(function(b){ if(b!==skip&&b.cmd) used[b.cmd]=1; });
  const free=DC_LINK.filter(function(l){
    if(l[0]!==mid||used[l[2]]) return false;
    const c=dcCompOf(l[1]);
    return !!c&&dcBaySameComp(c,t);
  });
  return free.length?free[0][2]:'';
}
function dcBayCompSel(mid,cur,t,idx){
  const groups=[], map={};
  DC_LINK.forEach(function(l){
    if(l[0]!==mid) return;
    const c=dcCompOf(l[1]); if(!c||!dcBaySameComp(c,t)) return;
    if(!map[c.id]){ map[c.id]={c:c,items:[]}; groups.push(map[c.id]); }
    map[c.id].items.push(l[2]);
  });
  if(!groups.length) return '';
  return '<select class="bay-sel'+(cur?'':' warn')+'" data-bayset="'+idx+'">'+
    '<option value=""'+(cur?'':' selected')+'>未绑定</option>'+
    groups.map(function(g){
      return '<optgroup label="'+esc(g.c.name)+'">'+g.items.map(function(cmd,i){
        const nm=g.c.name+(g.items.length>1?(' 第 '+(i+1)+' 台'):'');
        return '<option value="'+esc(cmd)+'"'+(cmd===cur?' selected':'')+'>'+esc(nm)+'</option>';
      }).join('')+'</optgroup>';
    }).join('')+'</select>';
}
function dcBayTab(m){
  const mid=m.id, rows=dcBayRows(mid);
  let body='', seq=0;
  if(rows.length){
    DC_BAY_GROUP.forEach(function(g){
      const rs=rows.filter(function(r){ return g.ts.indexOf(r.b.k)>=0; });
      if(!rs.length) return;
      body+='<tr class="bay-grp"><td colspan="5">'+g.n+'</td></tr>';
      body+=rs.map(function(r){
        const i=DC_BAY.indexOf(r.b);
        const sel=dcBayCompSel(mid,r.b.cmd,r.t,i);
        seq++;
        return '<tr><td class="num">'+String(seq).padStart(2,'0')+'</td>'+
          '<td><span class="bay-nm"><i class="bay-dot bay-'+r.b.k+'"></i><span class="strong">'+esc(r.name)+'</span></span></td>'+
          '<td>'+(sel||'<span class="bay-none">组件库里还没有这类硬件</span>')+
            (r.b.cmd?'<code class="bay-cmd">'+esc(r.b.cmd)+'</code>':'')+'</td>'+
          '<td class="bay-cap">'+esc(r.t.cap)+'</td>'+
          '<td class="r"><span class="ins-del" data-baydel="'+i+'" title="只删这个仓位，组件不受影响">移除</span></td></tr>';
      }).join('');
    });
  }else{
    body='<tr><td colspan="5" class="muted" style="text-align:center;padding:26px 12px">这个型号还没有料仓。'+
      '<div style="margin-top:12px"><button class="btn accent sm" data-baypickopen>＋ 添加仓位</button></div></td></tr>';
  }
  return '<div class="tbl-panel dc-inst bay-panel"><div class="tbl-hd"><span class="t">仓位清单</span>'+
    '<span class="a"><button class="btn accent sm" data-baypickopen>＋ 添加仓位</button></span></div>'+
    '<div class="tbl-wrap"><table class="ins-tbl bay-tbl"><thead><tr><th class="num" style="width:46px">#</th>'+
    '<th style="width:170px">仓位</th><th>关联组件</th><th style="width:106px">容量（默认）</th>'+
    '<th style="width:72px" class="r">操作</th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
}
function dcBayAdd(k){
  const d=DC.drawer; if(!d||d.kind!=='model') return;
  const t=dcBayType(k), mid=d.id;
  const cmd=dcBayFreeCmd(mid,t,null);
  DC_BAY.push(dcBayNew(mid,k,cmd));
  dcBaySort(); rerender();
  const n=dcBayList(mid).filter(function(b){ return b.k===k; }).length;
  const nm=t.n+(n>1?' '+n:'');
  toast('已添加 '+nm+(cmd?('，绑定 '+cmd):'，暂无空闲硬件'));
}
function dcBayDel(i){
  const b=DC_BAY[i]; if(!b) return;
  const t=dcBayType(b.k);
  DC_BAY.splice(i,1); rerender();
  toast('已移除 '+t.n+(b.cmd?' · 硬件 '+b.cmd+' 保留在组件里':''));
}
function dcBaySet(i,cmd){
  const b=DC_BAY[i]; if(!b) return;
  if(cmd){
    const dup=DC_BAY.some(function(x,j){ return j!==i&&x.mid===b.mid&&x.cmd===cmd; });
    if(dup){ toast('这台硬件已经绑在别的仓位了'); rerender(); return; }
  }
  b.cmd=cmd; rerender();
  if(cmd) toast('已绑定 '+cmd);
}
/* 组件页加装 / 移除硬件时，仓位跟着增减 */
function dcBayAttach(mid,cid,cmd){
  const c=dcCompOf(cid); if(!c) return;
  const t=DC_BAY_TYPE.filter(function(x){ return dcBaySameComp(c,x); })[0];
  if(!t) return;
  DC_BAY.push(dcBayNew(mid,t.k,cmd));
  dcBaySort();
}
function dcBayDetach(mid,cmd){
  for(let i=DC_BAY.length-1;i>=0;i--){
    if(DC_BAY[i].mid===mid&&DC_BAY[i].cmd===cmd) DC_BAY.splice(i,1);
  }
}
function dcBayPickModal(){
  const d=DC.drawer; if(!d||d.kind!=='model') return '';
  const rows=dcBayRows(d.id), cnt={};
  rows.forEach(function(r){ cnt[r.b.k]=(cnt[r.b.k]||0)+1; });
  const list=DC_BAY_TYPE.map(function(t){
    const n=cnt[t.k]||0;
    return '<div class="bayp-row"><i class="bay-dot bay-'+t.k+'"></i>'+
      '<span class="bayp-nm"><b>'+t.n+'</b><i>'+esc(t.hint)+' · 容量 '+esc(t.cap)+'</i></span>'+
      '<span class="bayp-have">'+(n?('已有 '+n+' 个'):'还没有')+'</span>'+
      '<button class="btn sm" data-bayadd="'+t.k+'">＋ 添加</button></div>';
  }).join('');
  return '<div class="mx-mask" data-baymask><div class="mx w480" data-baypanel>'+
    '<div class="mx-hd"><div><h3>添加仓位</h3><div class="mx-sub">选类型即可，同类仓可以连续加多个</div></div>'+
      '<button class="mx-x" data-baypickclose aria-label="关闭" title="关闭">×</button></div>'+
    '<div class="mx-bd">'+list+'</div>'+
    '<div class="mx-ft" style="justify-content:space-between">'+
      '<span class="muted" style="font-size:11.5px">当前共 '+rows.length+' 个仓位</span>'+
      '<button class="btn accent" data-baypickclose>完成</button></div></div></div>';
}
/* ============================================================

function dcCleanList(mid){ return DC_CLEAN.filter(function(x){ return x.mid===mid; }); }
function dcCleanCur(){
  const d=DC.drawer; if(!d||d.kind!=='model') return null;

/* 左：清洗程序菜单；右：这套程序里参与清洗的组件 ＋ 组件带出的参数 */
function dcTrigText(g){

function dcCleanSet(plan){

/* 已选组件排成一行，未选的收进「＋ 添加组件」下拉，避免十几台硬件铺满一屏 */
function dcCleanChips(m,plan){

function dcCleanToggleComp(cmd){

/* ============================================================
   导出：一个机型一份 xlsx，4 个页签（组件 / 料仓 / 配方 / 清洗）
   不引第三方库：自己拼 zip（store 不压缩）+ sheet XML
   列定义与导入共用，改这里两边同时生效
   ============================================================ */
var DC_CRC_T=null;
function dcCrc32(u8){
  if(!DC_CRC_T){
    DC_CRC_T=new Uint32Array(256);
    for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); DC_CRC_T[n]=c>>>0; }
  }
  var crc=0xFFFFFFFF;
  for(var i=0;i<u8.length;i++) crc=DC_CRC_T[(crc^u8[i])&0xFF]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function dcZip(files){
  var enc=new TextEncoder(), parts=[], cen=[], off=0;
  var dt=((2026-1980)<<9)|(11<<5)|28, tm=(9<<11)|(0<<5)|0;
  files.forEach(function(f){
    var nm=enc.encode(f.name);
    var data=(f.data instanceof Uint8Array)?f.data:enc.encode(String(f.data));
    var crc=dcCrc32(data);
    var lh=new Uint8Array(30+nm.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0x0800,true);
    lv.setUint16(8,0,true); lv.setUint16(10,tm,true); lv.setUint16(12,dt,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,data.length,true); lv.setUint32(22,data.length,true);
    lv.setUint16(26,nm.length,true); lv.setUint16(28,0,true);
    lh.set(nm,30);
    parts.push(lh,data);
    var ch=new Uint8Array(46+nm.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true); cv.setUint16(12,tm,true); cv.setUint16(14,dt,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,nm.length,true); cv.setUint16(30,0,true); cv.setUint16(32,0,true);
    cv.setUint16(34,0,true); cv.setUint16(36,0,true); cv.setUint32(38,0,true); cv.setUint32(42,off,true);
    ch.set(nm,46);
    cen.push(ch);
    off+=lh.length+data.length;
  });
  var csz=cen.reduce(function(a,b){ return a+b.length; },0);
  var eo=new Uint8Array(22), ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,csz,true); ev.setUint32(16,off,true);
  var all=parts.concat(cen,[eo]);
  var total=all.reduce(function(a,b){ return a+b.length; },0);
  var out=new Uint8Array(total), p=0;
  all.forEach(function(b){ out.set(b,p); p+=b.length; });
  return out;
}
function dcXlEsc(v){
  return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function dcXlCol(i){
  var s=''; i++;
  while(i>0){ var m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); }
  return s;
}
function dcXlNum(v){
  if(v===''||v==null) return '';
  var n=Number(v);
  return isNaN(n)?v:n;
}
function dcSheetXml(rows,widths){
  var out='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  out+='<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>';
  if(widths){
    out+='<cols>'+widths.map(function(w,i){
      return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>';
    }).join('')+'</cols>';
  }
  out+='<sheetData>';
  rows.forEach(function(r,ri){
    out+='<row r="'+(ri+1)+'">';
    r.forEach(function(v,ci){
      if(v===null||v===undefined||v==='') return;
      var ref=dcXlCol(ci)+(ri+1), st=ri===0?' s="1"':'';
      if(typeof v==='number'&&isFinite(v)) out+='<c r="'+ref+'"'+st+'><v>'+v+'</v></c>';
      else out+='<c r="'+ref+'"'+st+' t="inlineStr"><is><t xml:space="preserve">'+dcXlEsc(v)+'</t></is></c>';

var DC_XL_STYLES='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
  '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
  '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'+
  '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>'+
  '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'+
  '<fill><patternFill patternType="solid"><fgColor rgb="FF185FA5"/><bgColor indexed="64"/></patternFill></fill></fills>'+
  '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+
  '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
  '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'+
  '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
  '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs>'+
  '</styleSheet>';
function dcXlsx(sheets){
  var files=[], ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>';
  sheets.forEach(function(_,i){
    ct+='<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
  });
  ct+='</Types>';
  files.push({name:'[Content_Types].xml',data:ct});
  files.push({name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
    '</Relationships>'});
  var wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';
  sheets.forEach(function(sh,i){ wb+='<sheet name="'+dcXlEsc(sh.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>'; });
  wb+='</sheets></workbook>';
  files.push({name:'xl/workbook.xml',data:wb});
  var rel='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  sheets.forEach(function(_,i){
    rel+='<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';
  });
  rel+='<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>';
  rel+='</Relationships>';
  files.push({name:'xl/_rels/workbook.xml.rels',data:rel});
  files.push({name:'xl/styles.xml',data:DC_XL_STYLES});
  sheets.forEach(function(sh,i){
    files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',data:dcSheetXml(sh.rows,sh.widths)});
  });
  return dcZip(files);
}

function dcXlComp(mid,m){

function dcPickerModal(){

  const isComp=p.kind==='component';
  const mid=(DC.drawer&&DC.drawer.kind==='model')?DC.drawer.id:'';
  let items='', selN=0;
  if(isComp){
    let list=DC_COMP.slice();
    if(p.q) list=list.filter(c=>c.name.toLowerCase().indexOf(p.q.toLowerCase())>=0);
    items=list.length? list.map(c=>{
      const have=mid?dcInstsOf(mid,c.id).length:0;
      if(p.cmd[c.id]===undefined) p.cmd[c.id]=mid?dcNextCmd(mid,c.id):dcDefaultCmd(c.id);
      if(p.qty[c.id]===undefined) p.qty[c.id]=1;
      const on=!!p.checked[c.id]; if(on) selN+=Number(p.qty[c.id])||1;
      return '<div class="dc-opt'+(on?' on':'')+'">'+
        '<input type="checkbox" data-dcpick="'+c.id+'"'+(on?' checked':'')+'>'+
        '<span class="dc-opt-nm">'+esc(c.name)+(have?'<span class="bopt-have">已装 '+have+' 台</span>':'')+'</span>'+
        '<input class="dc-opt-code" data-dcpickcmd="'+c.id+'" value="'+esc(p.cmd[c.id])+'" placeholder="控制编码" aria-label="控制编码">'+
        '<span class="dc-opt-qty"><input type="number" data-dcpickqty="'+c.id+'" value="'+p.qty[c.id]+'" min="1" max="9" aria-label="加装台数"><i>台</i></span>'+
      '</div>';
    }).join('')
      : '<div class="dc-opt-empty">'+(p.q?'没有匹配的组件，换个关键词试试':'没有可添加的组件')+'</div>';
  }else{
    let list=DC_MODEL.slice();
    if(p.brand) list=list.filter(m=>m.brand===p.brand);
    if(p.q){ const q=p.q.toLowerCase(); list=list.filter(m=>m.name.toLowerCase().indexOf(q)>=0||dcBrandName(m.brand).toLowerCase().indexOf(q)>=0); }
    list=list.filter(m=>!(DC.drawer&&DC.drawer.kind==='component'&&DC_LINK.some(l=>l[1]===DC.drawer.id&&l[0]===m.id)));
    items=list.length? list.map(m=>{
      const cid=(DC.drawer&&DC.drawer.kind==='component')?DC.drawer.id:'';
      if(p.cmd[m.id]===undefined) p.cmd[m.id]=dcDefaultCmd(cid);
      const on=!!p.checked[m.id]; if(on) selN++;
      return '<div class="dc-opt'+(on?' on':'')+'">'+
        '<input type="checkbox" data-dcpick="'+m.id+'"'+(on?' checked':'')+'>'+
        '<span class="dc-opt-nm">'+esc(dcModelLabel(m))+'</span>'+
        '<input class="dc-opt-code" data-dcpickcmd="'+m.id+'" value="'+esc(p.cmd[m.id])+'" placeholder="指令代码" aria-label="指令代码">'+
      '</div>';
    }).join('')
      : '<div class="dc-opt-empty">'+(p.q||p.brand?'没有匹配的型号':'没有可添加的型号')+'</div>';
  }
  const brandOpts='<option value="">全部品牌</option>'+DC_BRAND.map(b=>'<option value="'+b.id+'"'+(p.brand===b.id?' selected':'')+'>'+esc(b.name)+'</option>').join('');
  const note=isComp?(selN?'已选 '+selN+' 台':'勾选组件后可改编码与台数'):(selN?'已选 '+selN+' 个型号':'可跨品牌多选，指令代码按型号自动填');
  const filterBar='<div class="dcf-grid">'+
      '<div class="field"'+(isComp?' style="grid-column:1/-1"':'')+'><label>搜索</label>'+dcSearchInput('data-dcpickerq',p.q,isComp?'搜索组件名称':'搜索型号或品牌',true)+'</div>'+
      (isComp?'':'<div class="field"><label>品牌筛选</label><select data-dcpickerbrand>'+brandOpts+'</select></div>')+
    '</div>';
  const newBlock=isComp?'<div class="dcf-sec" style="margin-top:16px;margin-bottom:0"><div class="dcf-hd"><h4>找不到组件？</h4><span class="hint">新建一个全局组件并关联当前型号</span></div>'+
      '<div style="display:flex;gap:8px;align-items:flex-start">'+
        '<div class="field" style="flex:1;min-width:0;margin-bottom:0"><input data-dcnewname value="'+esc(p.newName||'')+'" placeholder="输入新组件名称"></div>'+
        '<button class="btn" data-dccreatenew style="flex:0 0 auto">新建并关联</button>'+
      '</div></div>':'';
  return '<div class="mx-mask" data-dcmask><div class="mx w620">'+
    '<div class="mx-hd"><div><h3>'+(isComp?'添加组件':'添加适配型号')+'</h3>'+
      '<div class="mx-sub">'+(isComp?'勾选即加装；同一组件可加多台，控制编码自动顺延':'跨品牌多选型号，可填写指令代码')+'</div></div>'+
      '<button class="mx-x" data-dcpickerclose aria-label="关闭" title="关闭">×</button></div>'+
    '<div class="mx-bd">'+filterBar+
      '<div class="dc-opt-list">'+items+'</div>'+
      newBlock+
    '</div>'+
    '<div class="mx-ft"><span class="ft-note">'+note+'</span>'+
      '<button class="btn" data-dcpickerclose>取消</button><button class="btn accent" data-dcpickersave>添加所选</button></div></div></div>';
}

function dcSaveEdit(){
  const e=DC.edit; if(!e) return;
  const inp=document.querySelector('[data-dcname]'); if(!inp) return;
  const name=inp.value.trim();
  if(!name){ toast('名称必填'); return; }
  const brandSel=document.querySelector('[data-dcbrand]');
  const brandId=brandSel?brandSel.value:'';
  if(e.kind==='model'&&!brandId){ toast('请选择品牌'); return; }
  if(dcDup(e.kind,name,e.id==='NEW'?null:e.id,brandId)){
    toast(e.kind==='model'?'同品牌下已存在同名型号':(e.kind==='brand'?'品牌名称已存在':'组件名称已存在')); return;
  }
  const today=todayStr();
  if(e.id==='NEW'){
    const id=dcNewId(e.kind==='brand'?'B':(e.kind==='model'?'M':'C'));
    if(e.kind==='brand') DC_BRAND.push({id:id,name:name,img:e.img||'',created:today,updated:today});
    else if(e.kind==='model') DC_MODEL.push({id:id,brand:brandId,name:name,img:e.img||'',created:today,updated:today});
    else DC_COMP.push({id:id,name:name,cats:(e.cats||[]).slice(),points:(e.points||[]).map(dcClonePoint),created:today,updated:today});
    toast((e.kind==='brand'?'品牌':(e.kind==='model'?'型号':'组件'))+'创建成功');
  }else{
    let t=null;
    if(e.kind==='brand') t=DC_BRAND.find(x=>x.id===e.id);
    else if(e.kind==='model') t=DC_MODEL.find(x=>x.id===e.id);
    else t=DC_COMP.find(x=>x.id===e.id);
    if(!t) return;
    t.name=name; if(e.kind==='model') t.brand=brandId;
    if(e.kind==='brand'||e.kind==='model') t.img=e.img||'';
    if(e.kind==='component'){ t.cats=(e.cats||[]).slice(); t.points=(e.points||[]).map(dcClonePoint); }
    t.updated=today;
    toast('已更新');
  }
  DC.edit=null; rerender();
}

function dcPointEnumAdd(){
  const pe=DC.pointEdit; if(!pe) return;
  const inp=document.querySelector('[data-dcptenumnew]'); if(!inp) return;
  const v=inp.value.trim(); if(!v){ toast('请输入枚举值'); return; }
  pe.draft.enumVals=pe.draft.enumVals||[];
  pe.draft.enumVals.push(v); rerender();
}
function dcPointEnumDel(i){
  const pe=DC.pointEdit; if(!pe) return;
  pe.draft.enumVals=pe.draft.enumVals||[];
  pe.draft.enumVals.splice(i,1); rerender();
}
function dcSavePoint(){
  const pe=DC.pointEdit; if(!pe||!DC.edit) return;
  const q=function(sel){ const el=document.querySelector(sel); return el?el.value.trim():''; };
  const name=q('[data-dcptname]');
  const code=q('[data-dcptcode]');
  if(!name){ toast('参数名称必填'); return; }
  if(!code){ toast('控制编码必填'); return; }
  if(!/^[A-Za-z][A-Za-z0-9_]*$/.test(code)){ toast('控制编码需以字母开头，仅含字母/数字/下划线'); return; }
  const type=pe.draft.type;
  const dup=(DC.edit.points||[]).some(x=>x.code.toLowerCase()===code.toLowerCase() && x.pid!==pe.draft.pid);
  if(dup){ toast('控制编码在组件内已存在'); return; }
  let unit='',min='',max='';
  const enumVals=pe.draft.enumVals||[];
  const note=q('[data-dcptnote]');
  if(type==='value'){
    unit=q('[data-dcptunit]'); min=q('[data-dcptmin]'); max=q('[data-dcptmax]');
    if(min!==''&&max!==''&&Number(min)>Number(max)){ toast('最小值不能大于最大值'); return; }
  }else if(type==='enum'){
    if(!enumVals.length){ toast('枚举型至少需要一个枚举值'); return; }
  }
  const reqEl=document.querySelector('[data-dcptrequired]');
  const enEl=document.querySelector('[data-dcptenabled]');
  const pt=dcClonePoint({pid:pe.draft.pid||dcNewPointId(),code:code,name:name,type:type,unit:unit,min:min,max:max,enumVals:enumVals,def:pe.draft.def,note:note,required:reqEl?reqEl.checked:false,enabled:enEl?enEl.checked:true});
  if(pe.mode==='new'){
    DC.edit.points=(DC.edit.points||[]).concat(pt);
  }else{
    DC.edit.points=(DC.edit.points||[]).map(x=>x.pid===pe.draft.pid?pt:x);
  }
  DC.pointEdit=null; rerender(); toast('参数已保存');
}
function dcConfirmDo(){
  const c=DC.confirm; if(!c) return;
  if(c.kind==='inst'){
    const l=DC_LINK[c.idx]; if(l){
      const mid=l[0], cmd=l[2];
      DC_RECIPE.forEach(function(r){
        if(r.mid!==mid) return;
        r.steps.forEach(function(st){
          const sl=st.slots; if(!sl) return;
          for(const k in sl){ if(sl[k].cmd===cmd) delete sl[k]; }
        });
        r.steps=r.steps.filter(function(st){ return st.slots&&Object.keys(st.slots).length; });
      });
      DC_LINK.splice(c.idx,1);
      dcBayDetach(mid,cmd);
      DC.rcp.open=-1;
      toast('已移除 1 台 · 配方引用已清理');
    }
    DC.confirm=null; rerender(); return;
  }
  if(c.kind==='brandDel'){
    const i=DC_BRAND.findIndex(x=>x.id===c.id);
    if(i>=0) DC_BRAND.splice(i,1);
    DC.confirm=null; rerender(); toast('品牌已删除'); return;
  }
  if(c.kind==='compDel'){
    const i=DC_COMP.findIndex(x=>x.id===c.id);
    if(i>=0) DC_COMP.splice(i,1);
    for(let j=DC_LINK.length-1;j>=0;j--) if(DC_LINK[j][1]===c.id) DC_LINK.splice(j,1);
    DC.confirm=null; rerender(); toast('组件已删除'); return;
  }
  if(c.kind==='model'){
    const m=dcModelOf(c.id); if(!m) return;
    const i=DC_MODEL.indexOf(m); if(i>=0) DC_MODEL.splice(i,1);
    for(let j=DC_LINK.length-1;j>=0;j--) if(DC_LINK[j][0]===c.id) DC_LINK.splice(j,1);
    for(let j=DC_BAY.length-1;j>=0;j--) if(DC_BAY[j].mid===c.id) DC_BAY.splice(j,1);
    toast('型号已删除，组件资料保持不变');
  }
  DC.confirm=null; rerender();
}
function dcSavePicker(){
  const p=DC.picker, d=DC.drawer; if(!p||!d) return;
  const ids=Object.keys(p.checked).filter(k=>p.checked[k]);
  if(!ids.length){ toast(p.kind==='component'?'先勾选要添加的组件':'先勾选要添加的型号'); return; }
  let added=0, renamed=0;
  ids.forEach(function(id){
    if(p.kind==='component'){
      const n=Math.max(1,Math.min(9,Number(p.qty[id])||1));
      let cmd=String(p.cmd[id]||'').trim();
      for(let i=0;i<n;i++){
        if(!cmd||dcInstByCmd(d.id,cmd)){
          if(i===0&&cmd) renamed++;
          cmd=dcNextCmd(d.id,id);
        }
        DC_LINK.splice(dcInstBlockEnd(d.id,id),0,[d.id,id,cmd]);
        dcBayAttach(d.id,id,cmd);
        added++;
        cmd='';  /* 后续几台交给顺延，各自独立编码 */
      }
    }else{
      const cmd=String(p.cmd[id]||'').trim()||dcDefaultCmd(d.id);
      if(!DC_LINK.some(l=>l[0]===id&&l[1]===d.id)){ DC_LINK.push([id,d.id,cmd]); added++; }
    }
  });
  const today=todayStr();
  if(p.kind==='component'){ const m=dcModelOf(d.id); if(m) m.updated=today; DC.mTab='comp'; }
  else { const comp=dcCompOf(d.id); if(comp) comp.updated=today; }
  DC.picker=null; rerender();
  if(!added){ toast(p.kind==='component'?'没有新增组件':'没有新增适配关系'); return; }
  toast(p.kind==='component'
    ? ('已加装 '+added+' 台组件'+(renamed?'，控制编码重复已自动顺延':''))
    : ('已添加 '+added+' 条适配关系'));
}
function dcCreateNewComp(){
  const p=DC.picker, d=DC.drawer; if(!p||!d) return;
  const inp=document.querySelector('[data-dcnewname]'); if(!inp) return;
  const name=inp.value.trim(); if(!name){ toast('组件名称必填'); return; }
  if(dcDup('component',name)){ toast('组件名称已存在，请直接选择该组件'); return; }
  const id=dcNewId('C'), today=todayStr();
  DC_COMP.push({id:id,name:name,cats:[],created:today,updated:today});
  if(d.kind==='model'&&!DC_LINK.some(l=>l[0]===d.id&&l[1]===id)) DC_LINK.push([d.id,id,(p.cmd[id]||'').trim()||dcNextCmd(d.id,id)]);
  p.checked[id]=true; p.newName='';
  rerender(); toast('已创建全局组件并关联当前型号');
}

/* ============================================================
   11. 设备配置 · 八页（制作 / 料仓 / 清洗 / 校准 / 远程）
   链路：型号 → 装机实例 → 料仓 → 原料 → 配方 → 校准 → 清洗
   ============================================================ */

/* ---------- 11.2 装机实例（同组件可多实例） ---------- */
function cfgExpand(rows){
  var out=[];
  rows.forEach(function(r){
    var n=r.n||1;
    for(var i=0;i<n;i++){
      out.push({id:(n>1?r.slot+'-'+(i+1):r.slot),comp:r.comp,kind:r.kind||'std',
        cmd:r.cmd+(n>1?String(i+1):''),silo:(r.silos&&r.silos[i])||''});
    }
  });
  return out;
}
const CFG_INST={
  'M-WSD1008I':cfgExpand([
    {slot:'01',comp:'C-BREW',cmd:'cmd_brew'},
    {slot:'02',comp:'C-MIXL',n:3,cmd:'cmd_stir'},
    {slot:'03',comp:'C-GRIND',cmd:'cmd_grind',silos:['S-01']},
    {slot:'04',comp:'C-DISP',cmd:'cmd_disp',silos:['S-02']},
    {slot:'05',comp:'C-CUPBIN',cmd:'cmd_cup_bin'},
    {slot:'06',comp:'C-LIDBIN',cmd:'cmd_lid_bin'}
  ]),
  'M-SMOODER1':cfgExpand([
    {slot:'01',comp:'C-VMIX',cmd:'cmd_vmix'},
    {slot:'02',comp:'C-FLOW',cmd:'cmd_flow'},
    {slot:'03',comp:'C-AIR',cmd:'cmd_air'}
  ])
};
function cfgInsts(mid){
  if(CFG_INST[mid]) return CFG_INST[mid];
  return DC_LINK.filter(function(l){ return l[0]===mid; }).map(function(l,i){
    var no=('0'+(i+1)).slice(-2);
    return {id:no,comp:l[1],kind:'std',cmd:l[2],silo:''};
  });
}
function cfgInst(mid,iid){ return cfgInsts(mid).filter(function(x){ return x.id===iid; })[0]; }
function cfgInstLabel(x){
  var c=dcCompOf(x.comp);
  return (c?c.name:x.comp)+' '+x.id;
}
/* 多实例的指令代码只差尾号，收成 cmd_disp1…6 一行，避免表格被撑高 */
function cfgCmdCell(cmds){
  cmds=cmds.filter(Boolean);
  if(!cmds.length) return '<span class="muted">—</span>';
  var body;
  if(cmds.length<=2){ body=cmds.map(esc).join('<br>'); }
  else{
    var a=cmds[0], b=cmds[cmds.length-1], i=0;
    while(i<a.length&&a[i]===b[i]) i++;
    body=esc(a.slice(0,i))+'<span style="opacity:.55">'+esc(a.slice(i))+'…'+esc(b.slice(i))+'</span>';
  }
  return '<code style="font-size:10.5px;white-space:nowrap;line-height:1.7">'+body+'</code>';
}

/* ---------- 11.2b 装机清单：工位 / 实例 / 级联影响 ---------- */
function cfgSlots(mid){
  var g={},order=[];
  cfgInsts(mid).forEach(function(x){
    var s=x.id.split('-')[0];
    if(!g[s]){ g[s]={slot:s,list:[]}; order.push(s); }
    g[s].list.push(x);
  });
  order.sort();
  return order.map(function(s){ return g[s]; });
}
function cfgNextSlot(mid){
  var n=0; cfgSlots(mid).forEach(function(g){ n=Math.max(n,parseInt(g.slot,10)||0); });
  return ('0'+(n+1)).slice(-2);
}
function cfgInstList(mid){ if(!CFG_INST[mid]) CFG_INST[mid]=cfgInsts(mid); return CFG_INST[mid]; }
function cfgAfterInstChange(mid){ delete CFG_CLEAN[mid]; }
function cfgDropInstRefs(mid,iid){
  cfgSilos(mid).forEach(function(s){
    if(s.inst!==iid) return;
    s.inst=''; s.cal=0;           /* 硬件都不在了，原来的校准不再成立 */
    delete CFG_CAL[mid+'|'+s.no];
  });
  delete CFG_CPM[mid+'|'+iid];
}
function cfgRenumber(mid){
  cfgInsts(mid).forEach(function(x){
    var p=x.id.split('-');
    if(p[1]!=='1') return;
    var slot=p[0], arr=cfgInsts(mid).filter(function(y){ return y.id.split('-')[0]===slot; });
    if(arr.length!==1) return;
    cfgSilos(mid).forEach(function(s){ if(s.inst===x.id) s.inst=slot; });
    if(CFG_CPM[mid+'|'+x.id]){ CFG_CPM[mid+'|'+slot]=CFG_CPM[mid+'|'+x.id]; delete CFG_CPM[mid+'|'+x.id]; }
    x.id=slot; x.cmd=String(x.cmd||'').replace(/\d+$/,'');
  });
}
function cfgImpact(mid,iids){
  var silos=cfgSilos(mid).filter(function(s){ return iids.indexOf(s.inst)>=0; });
  var prm=0;
  iids.forEach(function(i){
    var x=cfgInst(mid,i), sp=x&&cfgPSpec(x.comp);
    if(sp) prm+=sp.f.filter(function(f){ return f.t!=='ro'; }).length;
  });
  return {silos:silos,calN:silos.filter(function(s){ return s.cal>0; }).length,prm:prm};
}
function cfgAddComp(mid,cid,qty){
  if(!cid) return '先选一个组件';
  qty=Math.max(1,Math.min(12,Number(qty)||1));
  var arr=cfgInstList(mid), slot=cfgNextSlot(mid), cmd=dcDefaultCmd(cid);
  for(var i=0;i<qty;i++){
    arr.push({id:qty>1?slot+'-'+(i+1):slot,comp:cid,kind:'std',cmd:cmd+(qty>1?String(i+1):''),silo:''});
  }
  DC_LINK.push([mid,cid,dcNextCmd(mid,cid)]);
  cfgAfterInstChange(mid);
  return '';
}
function cfgAddInst(mid,slot){
  var arr=cfgInstList(mid), gp=arr.filter(function(x){ return x.id.split('-')[0]===slot; });
  if(!gp.length) return '';
  if(gp.length===1&&gp[0].id===slot){
    var old=gp[0].id;
    gp[0].id=slot+'-1'; gp[0].cmd=(gp[0].cmd||'')+'1';
    cfgSilos(mid).forEach(function(s){ if(s.inst===old) s.inst=slot+'-1'; });
    if(CFG_CPM[mid+'|'+old]){ CFG_CPM[mid+'|'+slot+'-1']=CFG_CPM[mid+'|'+old]; delete CFG_CPM[mid+'|'+old]; }
  }
  var max=1;
  arr.filter(function(x){ return x.id.split('-')[0]===slot; }).forEach(function(x){
    var p=x.id.split('-'); max=Math.max(max,p[1]?parseInt(p[1],10):1);
  });
  var base=String(gp[0].cmd||'').replace(/\d+$/,'');
  arr.push({id:slot+'-'+(max+1),comp:gp[0].comp,kind:gp[0].kind||'std',cmd:base+(max+1),silo:''});
  cfgAfterInstChange(mid);
  return '';
}
function cfgDelInst(mid,iid){
  var arr=cfgInstList(mid), idx=-1;
  for(var i=0;i<arr.length;i++){ if(arr[i].id===iid) idx=i; }
  if(idx<0) return;
  var slot=arr[idx].id.split('-')[0], comp=arr[idx].comp;
  arr.splice(idx,1);
  cfgDropInstRefs(mid,iid);
  cfgRenumber(mid);
  var left=arr.filter(function(x){ return x.comp===comp; });
  if(!left.length){
    for(var j=DC_LINK.length-1;j>=0;j--){ if(DC_LINK[j][0]===mid&&DC_LINK[j][1]===comp) DC_LINK.splice(j,1); }
  }
  cfgAfterInstChange(mid);
}

function cfgCompParams(mid,steps){
  var groups=[], map={};
  cfgInsts(mid).forEach(function(x){
    var sp=cfgPSpec(x.comp); if(!sp) return;
    if(!map[x.comp]){ map[x.comp]={comp:x.comp,spec:sp,list:[]}; groups.push(map[x.comp]); }
    map[x.comp].list.push(x);
  });
  if(!groups.length) return '<div class="cfg-empty">该型号还没有可配置参数的组件实例。</div>';
  var hasOpt=false;
  var cards=groups.map(function(g){
    var c=dcCompOf(g.comp)||{name:g.comp}, fs=g.spec.f;
    var setN=0;
    g.list.forEach(function(x){ fs.forEach(function(f){ if(f.t!=='ro'&&cfgParamIsSet(mid,x.id,f)) setN++; }); });
    var head='<div class="h">实例</div>'+fs.map(function(f){
      return '<div class="h" title="'+esc(f.label)+'">'+esc(f.label)+(f.u?'<span style="opacity:.65;white-space:nowrap">&nbsp;'+esc(f.u)+'</span>':'')+'</div>';
    }).join('');
    var rows='';
    g.list.forEach(function(x){
      if(x.kind!=='std') hasOpt=true;
      rows+='<div class="i" title="'+esc(cfgInstLabel(x))+'">'+esc(x.id)+(x.kind!=='std'?'<span style="color:var(--brand)">*</span>':'')+'</div>';
      fs.forEach(function(f){
        var v=cfgParamVal(mid,x.id,f), isSet=cfgParamIsSet(mid,x.id,f);
        if(f.t==='sel'){
          rows+='<select data-cfgcp="'+esc(x.id)+'|'+esc(f.k)+'">'+f.o.map(function(o){
            return '<option'+(String(v)===String(o)?' selected':'')+'>'+esc(o)+'</option>';
          }).join('')+'</select>';
        }else if(f.t==='ro'){
          rows+='<input value="'+esc(v)+'" disabled title="由校准表反算，不手填秒数">';
        }else{
          rows+='<input type="number" min="'+f.min+'" max="'+f.max+'" step="'+f.step+'" data-cfgcp="'+esc(x.id)+'|'+esc(f.k)+'" value="'+v+'"'+(isSet?' class="chg"':'')+'>';
        }
      });
    });
    var use=cfgCompUse(mid,g.comp,steps);
    return '<div class="cfg-pc'+(setN?' mod':'')+'">'+
      '<div class="cfg-pc-hd"><b>'+esc(c.name)+'</b><span class="n">'+g.list.length+' 个实例</span>'+
        '<code>'+esc(g.list[0].cmd||'')+'</code>'+
        '<span class="lnk" data-cfgpcreset="'+esc(g.comp)+'">恢复默认</span></div>'+
      '<div class="cfg-pc-scroll"><div class="cfg-pc-tb" style="grid-template-columns:78px repeat('+fs.length+',minmax(0,1fr))">'+head+rows+'</div></div>'+
      '<div class="cfg-pc-ft">'+
        (fs.some(function(f){ return f.w; })?'<span class="u">含待确认项</span>':'')+
        '<span style="margin-left:auto">'+(use?'配方引用 '+use+' 步':'本配方未引用')+'</span></div>'+
      '</div>';
  }).join('');
  return '<div class="cfg-pcs">'+cards+'</div>'+
    (hasOpt?'<div class="cfg-note">＊ 选配实例，勾了选配包才下发。</div>':'');
}

/* ---------- 11.4c 型号详情：一份型号的五个关联视角 ---------- */
function cfgRecipeFits(mid){
  var out=[];
  CFG_SPU.forEach(function(sp){
    sp.temps.forEach(function(t){
      var steps=CFG_RECIPE[sp.id+'|'+t], missing=[], water=0;
      if(!steps){ out.push({spu:sp,temp:t,n:0,water:0,missing:['还没有配置配方'],ok:false}); return; }
      steps.forEach(function(s){
        water+=s.ml||0;
        if(s.mat&&!cfgSiloByMat(mid,s.mat)) missing.push('料仓没装 '+(cfgMat(s.mat)||{}).name);
        if(s.ml&&!cfgHasComp(mid,'C-WATER')&&!cfgHasComp(mid,'C-BREW')) missing.push('没有水路系统');
        if(s.g&&(cfgMat(s.mat)||{}).type==='豆'&&!cfgHasComp(mid,'C-GRIND')) missing.push('没有磨豆电机');
        if(s.stir&&!(cfgHasComp(mid,'C-MIXL')||cfgHasComp(mid,'C-MIXR'))) missing.push('没有搅拌器');
        if(s.disp&&s.mat&&!(cfgHasComp(mid,'C-DISP')||cfgHasComp(mid,'C-PERI'))) missing.push('没有出料电机');
        if(s.disp&&!s.mat&&!cfgHasComp(mid,'C-DROP')&&!cfgHasComp(mid,'C-CUPBIN')) missing.push('没有落杯机构');
        if(s.preMl&&!cfgHasComp(mid,'C-BREW')) missing.push('没有冲泡器');
      });
      missing=missing.filter(function(v,i){ return missing.indexOf(v)===i; });
      out.push({spu:sp,temp:t,n:steps.length,water:water,missing:missing,ok:!missing.length});
    });
  });
  return out;
}
function cfgModelDetailPage(){
  var mid=CFG.mdId, m=dcModelOf(mid)||{name:mid,brand:'B-WSD',updated:'—'};
  var prof=cfgProfile(mid), insts=cfgInsts(mid), silos=cfgSilos(mid);
  var fits=cfgRecipeFits(mid), okN=fits.filter(function(f){ return f.ok; }).length;
  var clean=cfgCleanOf(mid);
  var cJoin=insts.filter(function(x){ return (clean.rows[x.id]||{}).join; });
  var cDur=0,cWater=0;
  cJoin.forEach(function(x){ var r=clean.rows[x.id]; cDur+=r.dur*r.times; cWater+=r.water*r.times; });
  var opOk=CFG_OPS.filter(function(o){ return cfgOp(mid,o); }).length;
  var rm=cfgRemoteOf(mid);
  var capOn=CFG_CAPS.filter(function(c){ return rm.cap[c.id]; }).length;

  /* 1 组件：按工位归组 */
  var g={},order=[];
  insts.forEach(function(x){
    var s=x.id.split('-')[0];
    if(!g[s]){ g[s]={s:s,l:[]}; order.push(s); }
    g[s].l.push(x);
  });
  order.sort();
  var compRows=order.map(function(s){
    var gp=g[s], names=[], opt=false, cmds=[], siloNos=[];
    gp.l.forEach(function(x){
      names.push((dcCompOf(x.comp)||{}).name||x.comp);
      if(x.kind!=='std') opt=true;
      if(cmds.indexOf(x.cmd)<0&&x.cmd) cmds.push(x.cmd);
      var sl=silos.filter(function(y){ return y.inst===x.id; }).map(function(y){ return y.no; });
      siloNos=siloNos.concat(sl);
    });
    return '<tr><td><b>'+esc(s)+'</b></td>'+
      '<td>'+esc(names.filter(function(v,i){ return names.indexOf(v)===i; }).join(' / '))+
        '<div class="cfg-lock">'+esc(dcCatText(dcCompOf(gp.l[0].comp)||{})||'未分类')+'</div></td>'+

      '<td class="num">'+gp.l.length+'</td>'+
      '<td>'+(opt?cfgTag('含选配','info'):'标配')+'</td>'+
      '<td>'+(siloNos.length?esc(siloNos.join('、')):'<span class="muted">—</span>')+'</td>'+
      '<td>'+cfgCmdCell(cmds)+'</td></tr>';
  }).join('');
  var catN={};
  insts.forEach(function(x){ var c=dcCatText(dcCompOf(x.comp)||{})||'未分类'; catN[c]=(catN[c]||0)+1; });
  var catChips=Object.keys(catN).map(function(k){
    return '<span class="badge neutral" style="font-size:10.5px">'+esc(k)+' '+catN[k]+'</span>';
  }).join(' ');

  /* 2 配方 */
  var fitRows=fits.map(function(f){
    return '<tr'+(f.ok?'':' class="pf-off"')+'><td><b>'+esc(f.spu.name)+'</b><div class="cfg-lock">'+esc(f.spu.sku)+'</div></td>'+
      '<td>'+esc(f.temp)+'饮 · '+esc(f.spu.sizes.join('/'))+'</td>'+
      '<td class="num">'+f.n+' 步</td>'+
      '<td class="num">'+f.water+' ml</td>'+
      '<td>'+(f.ok?'<span class="muted">—</span>':'<span style="color:var(--ds-caution-text)">'+esc(f.missing.join('；'))+'</span>')+'</td>'+
      '<td>'+(f.ok?cfgTag('可做','success'):cfgTag('受限','warn'))+'</td></tr>';
  }).join('');

  /* 3 料仓 */
  var siloRows=silos.map(function(s){
    var ix=s.inst?cfgInst(mid,s.inst):null;
    return '<tr'+(s.mat?'':' class="pf-off"')+'><td><b>'+esc(s.no)+'</b></td><td>'+esc(s.type)+'</td>'+
      '<td>'+(ix?esc(cfgInstLabel(ix)):'<span class="muted">未绑定</span>')+'</td>'+
      '<td>'+(s.mat?esc((cfgMat(s.mat)||{}).name):'<span class="muted">未绑料</span>')+'</td>'+
      '<td class="num">'+s.cap+' '+esc(s.unit)+'</td>'+
      '<td class="num">'+s.low+' '+esc(s.unit)+'</td>'+
      '<td>'+cfgCalTag(s)+'</td></tr>';
  }).join('');

function cfgCalibPage(){
  cfgSync();
  var mid=CFG.model;
  /* 只有绑了料的仓位才谈得上校准；没绑料的仓位不出现在下拉里 */
  var silos=cfgSilos(mid).filter(function(x){ return !!x.mat&&!!x.inst; });
  if(!silos.length){
    return '<div class="kpis k5">'+pcKPI('可校准仓位','0')+pcKPI('校准版本','—')+pcKPI('实测档位','—')+pcKPI('5 档速度','—')+pcKPI('状态','待绑料')+'</div>'+
      '<div class="cfg-empty">还没有绑料的仓位，校准没有对象。<br />先去「料仓」给仓位选一种原料。</div>';
  }
  var silo=cfgSiloOf(mid,CFG.calSilo)||silos[0];
  var cal=silo?cfgCalOf(mid,silo.no):{rows:[],ver:0,samples:0};
  var speed=cfgCalSpeed(cal);
  var bad=cal.rows.some(function(r,i){
    if(i===0) return false;
    var p=cal.rows[i-1];
    return p.w&&r.w&&r.w/p.t < p.w/p.t;
  });
  var rows=cal.rows.map(function(r){
    var sp=r.t?(r.w/r.t):0;
    return '<tr><td><b>'+r.lv+' 档</b></td>'+
      '<td><input class="pf-num" type="number" step="0.1" min="0" max="60" data-cfgcal="'+r.lv+'|t" value="'+r.t+'"></td>'+
      '<td><input class="pf-num" type="number" step="0.1" min="0" data-cfgcal="'+r.lv+'|w" value="'+r.w+'"></td>'+
      '<td class="pf-range">'+(sp?sp.toFixed(2)+' g/s':'—')+'</td>'+
      '<td class="pf-range">'+(sp?(sp/10).toFixed(2)+' g':'—')+'</td>'+
      '<td>'+(r.lv===5?cfgTag('默认使用','success'):(r.w?'实测':'未测'))+'</td></tr>';
  }).join('');
  return '<div class="kpis k5">'+
      pcKPI('校准版本',cal.ver?'v'+cal.ver:'未校准')+
      pcKPI('实测档位',cal.rows.filter(function(r){return !!r.w;}).length+' / '+cal.rows.length)+
      pcKPI('5 档速度',speed?speed.toFixed(2)+' g/s':'—')+
      pcKPI('样本数',cal.samples)+
      pcKPI('状态',bad?'<span style="color:var(--ds-critical-text)">倒挂</span>':(cal.ver?'可用':'待校准'))+
    '</div>'+
    cfgBar({sn:true,act:'<button class="btn" data-cfgcalreset>清空重测</button><button class="btn accent" data-cfgcalsave>生成新版本</button>'})+
    '<div class="tbl-panel" style="margin-bottom:12px"><div class="tbl-hd"><span class="t">选择仓位</span></div>'+
      '<div style="padding:12px 14px"><div class="cfg-grid">'+
        '<div class="cfg-field"><label>仓位</label><select data-cfgcalsilo>'+silos.map(function(s){
          return '<option value="'+esc(s.no)+'"'+(CFG.calSilo===s.no?' selected':'')+'>'+esc(s.no)+' · '+esc(s.type)+(s.mat?' · '+esc((cfgMat(s.mat)||{}).name):' · 未绑料')+'</option>';
        }).join('')+'</select></div>'+
        '<div class="cfg-field"><label>组件实例</label><input value="'+esc(silo?(cfgInstLabel(cfgInst(mid,silo.inst)||{comp:'',id:silo.inst})):'—')+'" disabled></div>'+
        '<div class="cfg-field"><label>原料</label><input value="'+esc(silo&&silo.mat?((cfgMat(silo.mat)||{}).name):'未绑定')+'" disabled></div>'+
      '</div></div></div>'+
    '<div class="tbl-panel"><div class="tbl-hd"><span class="t">档位换算表</span></div>'+
      '<div class="tbl-wrap"><table class="pf-tbl"><thead><tr><th style="width:90px">档位</th><th style="width:130px">出料时长 s</th><th style="width:130px">实测重量 g</th><th style="width:120px">换算速度</th><th style="width:110px">每 100ms</th><th>说明</th></tr></thead><tbody>'+
      (rows||'<tr><td colspan="6" class="pc-empty">该仓位没有可校准的档位。</td></tr>')+'</tbody></table></div></div>'+
    (bad?'<div class="pc-note warn" style="margin-top:12px"><b>相邻档位速度倒挂</b>：高档出料反而更慢，通常是称重录错或粉料结块，修正后才能生成版本。</div>':'')+
    '<div class="cfg-note" style="margin-top:10px">换粉料品牌需重校，同档同时长不同批次可差 15%。</div>';

}

/* ---------- 11.13 事件 ---------- */
document.addEventListener('click',function(e){
  if(!isDevCfg()) return;
  var t=e.target;
  function hit(attr){ var el=t.closest('['+attr+']'); return el?el.getAttribute(attr):null; }
  var v;
  if((v=hit('data-cfgmd'))!==null){
    CFG.mdId=v; CFG.model=v; CFG.sub='overview'; CFG.pend=null; CFG.addOpen=false;
    var mm=dcModelOf(v); if(mm) CFG.brand=mm.brand;
    cfgSync(); rerender(); return;
  }
  if((v=hit('data-cfgmdback'))!==null){ CFG.mdId=''; CFG.sub='overview'; CFG.pend=null; CFG.addOpen=false; rerender(); return; }
  if((v=hit('data-cfgsub'))!==null){ CFG.sub=v; CFG.pend=null; CFG.addOpen=false; CFG.err='';
    try{ history.replaceState(null,'','#/settings/'+v); }catch(e){}
    rerender(); return; }
  if((v=hit('data-cfgmdjump'))!==null){
    var sec=document.getElementById('md-'+v);
    if(sec) sec.scrollIntoView({block:'start'});
    return;
  }
  if((v=hit('data-cfgmdgo'))!==null){ CFG.sub=v; CFG.pend=null; rerender(); return; }
  /* 装机清单：加组件 / 加实例 / 移除（移除先摊影响面，二次确认） */
  if((v=hit('data-cfgcompadd'))!==null){ CFG.addOpen=true; CFG.pend=null; rerender(); return; }
  if((v=hit('data-cfgaddcancel'))!==null){ CFG.addOpen=false; CFG.err=''; rerender(); return; }
  if((v=hit('data-cfgaddok'))!==null){
    var em=cfgAddComp(CFG.model,CFG.addComp,CFG.addQty);
    if(em){ CFG.err=em; rerender(); return; }
    CFG.addOpen=false; CFG.err=''; rerender(); toast('已添加组件到工位'); return;
  }
  if((v=hit('data-cfginstadd'))!==null){ cfgAddInst(CFG.model,v); rerender(); toast('工位 '+v+' 加了一个实例'); return; }
  if((v=hit('data-cfginstdel'))!==null){
    var xi=cfgInst(CFG.model,v);
    CFG.pend={iids:[v],label:xi?cfgInstLabel(xi):v}; CFG.addOpen=false; rerender(); return;
  }
  if((v=hit('data-cfgslotdel'))!==null){
    var gp=cfgSlots(CFG.model).filter(function(g){ return g.slot===v; })[0];
    if(gp){
      var nm=(dcCompOf(gp.list[0].comp)||{}).name||gp.list[0].comp;
      CFG.pend={iids:gp.list.map(function(x){ return x.id; }),label:'工位 '+v+'（'+nm+' ×'+gp.list.length+'）'};
      CFG.addOpen=false; rerender();
    }
    return;
  }
  if((v=hit('data-cfgpendok'))!==null){
    if(CFG.pend){ CFG.pend.iids.slice().forEach(function(iid){ cfgDelInst(CFG.model,iid); }); }
    CFG.pend=null; CFG.err=''; rerender(); toast('已移除，相关仓位与参数同步清理'); return;
  }
  if((v=hit('data-cfgpendno'))!==null){ CFG.pend=null; rerender(); return; }
  if((v=hit('data-cfgsiloadd'))!==null){
    var list=cfgSilos(CFG.model);
    var no='S-'+('0'+(list.filter(function(s){ return s.no.indexOf('S-')===0; }).length+1)).slice(-2);
    list.push({no:no,type:'料盒',inst:'',mat:'',cap:4.3,unit:'L',low:0.4,cal:0});
    rerender(); toast('已新增仓位 '+no); return;
  }
  if((v=hit('data-cfgsilodel'))!==null){
    var arr=cfgSilos(CFG.model);
    for(var i=arr.length-1;i>=0;i--){ if(arr[i].no===v) arr.splice(i,1); }
    delete CFG_CAL[CFG.model+'|'+v];
    rerender(); return;
  }
  if((v=hit('data-cfgcaljump'))!==null){ CFG.calSilo=v; CFG.sub='calib'; rerender(); return; }
  if((v=hit('data-cfgstepadd'))!==null){
    cfgSteps().push({mat:'',water:'热水',ml:100,g:0,stir:0,disp:0,preMl:0,preS:0});
    rerender(); return;
  }
  if((v=hit('data-cfgstepdel'))!==null){
    var st=cfgSteps(); st.splice(Number(v),1);
    if(!st.length) st.push({mat:'',water:'热水',ml:100,g:0,stir:0,disp:0,preMl:0,preS:0});
    rerender(); return;
  }
  if((v=hit('data-cfgpcreset'))!==null){
    cfgInsts(CFG.model).forEach(function(x){
      if(x.comp===v) delete CFG_CPM[cfgParamKey(CFG.model,x.id)];
    });
    rerender(); toast('已恢复该组件的出厂默认'); return;
  }
  if((v=hit('data-cfgsw'))!==null){
    var cs=cfgCleanOf(CFG.model);
    if(v==='follow') cs.follow=!cs.follow;
    if(v==='count') cs.count=!cs.count;
    if(v==='single') cs.single=!cs.single;
    rerender(); return;
  }
  if((v=hit('data-cfgcleanreset'))!==null){ delete CFG_CLEAN[CFG.model]; rerender(); toast('已恢复该型号的清洗默认值'); return; }
  if((v=hit('data-cfgrecreset'))!==null){ delete CFG_RECIPE[CFG.spu+'|'+CFG.temp]; rerender(); toast('已恢复默认配方'); return; }
  if((v=hit('data-cfgsave'))!==null){ toast('已保存（demo 不落库）'); return; }
  if((v=hit('data-cfgcap'))!==null){
    var rm=cfgRemoteOf(CFG.model);
    rm.cap[v]=!rm.cap[v]; rerender(); return;
  }
  if((v=hit('data-cfgcalsave'))!==null){
    var mid=CFG.model, silo=cfgSiloOf(mid,CFG.calSilo);
    if(!silo){ toast('先选一个仓位'); return; }
    var cal=cfgCalOf(mid,silo.no);
    var measured=cal.rows.filter(function(r){ return r.w>0; }).length;
    if(!measured){ toast('至少要有一个档位实测'); return; }
    var bad=cal.rows.some(function(r,i){
      if(!i||!r.w||!cal.rows[i-1].w) return false;
      var a=cal.rows[i-1].w/cal.rows[i-1].t, b=r.w/r.t;
      return b<a;
    });
    if(bad){ toast('相邻档位速度倒挂，先修正称重记录'); return; }
    cal.ver=cal.ver+1; cal.samples=3;
    cal.at='2026-11-27'; cal.by='当前账号';
    silo.cal=cal.ver;
    rerender(); toast('已生成校准 v'+cal.ver+'，引用该仓位的配方自动切换'); return;
  }
  if((v=hit('data-cfgcalreset'))!==null){
    var c2=cfgCalOf(CFG.model,CFG.calSilo);
    c2.rows.forEach(function(r){ r.w=0; }); c2.ver=0; c2.samples=0;
    var s2=cfgSiloOf(CFG.model,CFG.calSilo); if(s2) s2.cal=0;
    rerender(); return;
  }
  if((v=hit('data-cfgtaskrun'))!==null){
    var m=cfgModel(), rmx=cfgRemoteOf(m.id);
    var devs=CFG_DEV[m.id]||[];
    var sn=CFG.taskSn||(devs[0]||{}).sn||'';
    var cap=CFG_CAPS.filter(function(x){ return x.id===CFG.taskAction; })[0]||CFG_CAPS[0];
    if(!sn){ CFG.err='该型号没有在网设备'; rerender(); return; }
    if(!rmx.cap[cap.id]){ CFG.err='该能力未开启：'+cap.name+'，先在上方打开'; rerender(); return; }
    if(cap.risk&&String(CFG.confirmSn||'').trim()!==sn.slice(-4)){ CFG.err='确认失败：请输入 '+sn+' 的后四位'; rerender(); return; }
    CFG.err=''; CFG.confirmSn='';
    var now=new Date();
    var task={id:'RT-20261127-0'+(31+CFG_TASK.length),sn:sn,model:m.id,action:cap.name,
      by:'当前账号 · '+rmx.role[cap.id],at:'11-27 '+('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2),
      status:'执行中',cost:'—',result:'已下发，等待回执'};
    CFG_TASK.unshift(task);
    rerender(); toast('已发起：'+cap.name);
    setTimeout(function(){
      task.status='成功'; task.cost='3.6 s'; task.result='回执正常';
      if(isDevCfg()&&CFG.sub==='remote') rerender();
    },1100);
    return;
  }
});
document.addEventListener('change',function(e){
  if(!isDevCfg()) return;
  var d=e.target.dataset, val=e.target.value;
  if(d.cfgbrand!==undefined){ CFG.brand=val; CFG.model=''; cfgSync(); rerender(); return; }
  if(d.cfgmodel!==undefined){ CFG.model=val; CFG.sn=''; cfgSync(); rerender(); return; }
  if(d.cfgsn!==undefined){ CFG.sn=val; rerender(); return; }
  if(d.cfgspu!==undefined){ CFG.spu=val; CFG.temp=''; CFG.size=''; cfgSync(); rerender(); return; }
  if(d.cfgtemp!==undefined){ CFG.temp=val; rerender(); return; }
  if(d.cfgsize!==undefined){ CFG.size=val; rerender(); return; }
  if(d.cfgaddsel!==undefined){ CFG.addComp=val; rerender(); return; }
  if(d.cfgaddqty!==undefined){ CFG.addQty=Math.max(1,Math.min(12,Number(val)||1)); rerender(); return; }
  if(d.cfgsilomat!==undefined){
    var s=cfgSiloOf(CFG.model,d.cfgsilomat);
    if(s){ if(s.mat!==val){ s.cal=0; delete CFG_CAL[CFG.model+'|'+s.no]; } s.mat=val; }
    rerender(); return;
  }
  if(d.cfgsiloinst!==undefined){
    var s2=cfgSiloOf(CFG.model,d.cfgsiloinst); if(s2) s2.inst=val; rerender(); return;
  }
  if(d.cfgsilofield!==undefined){
    var p=d.cfgsilofield.split('|'), s3=cfgSiloOf(CFG.model,p[0]);
    if(s3) s3[p[1]]=Number(val)||0;
    rerender(); return;
  }
  if(d.cfgstep!==undefined){
    var q=d.cfgstep.split('|'), i=Number(q[0]), f=q[1], steps=cfgSteps();
    if(steps[i]){
      if(f==='mat'||f==='water') steps[i][f]=val;
      else steps[i][f]=val===''?0:Number(val);
      if(f==='mat'&&!val) steps[i].g=0;
      if(f==='water'&&!val) steps[i].ml=0;
    }
    rerender(); return;
  }
  if(d.cfgcp!==undefined){
    var qp=d.cfgcp.split('|'), iid=qp[0], key=qp[1];
    var xi=cfgInst(CFG.model,iid), spi=xi?cfgPSpec(xi.comp):null;
    if(spi){
      var fd=spi.f.filter(function(y){ return y.k===key; })[0];
      var oi=cfgParams(CFG.model,iid);
      if(fd&&fd.t==='num'){
        var nv=Number(val); if(isNaN(nv)) nv=fd.d;
        oi[key]=Math.min(fd.max,Math.max(fd.min,nv));
        /* 料盒容积改了，对应仓位的容量跟着改，两处不要各说一套 */
        if(xi.comp==='C-DISP'&&key==='cap'){
          cfgSilos(CFG.model).forEach(function(s4){ if(s4.inst===iid&&s4.unit==='L') s4.cap=oi[key]; });
        }
      }else oi[key]=val;
    }
    rerender(); return;
  }
  if(d.cfgclean!==undefined){
    var q2=d.cfgclean.split('|'), cs=cfgCleanOf(CFG.model), row=cs.rows[q2[0]]||{};
    if(q2[1]==='join'){
      row.join=e.target.checked;
      if(row.join&&!row.dur){ row.dur=45; row.times=3; row.water=600; }
    }
    cs.rows[q2[0]]=row; rerender(); return;
  }
  if(d.cfgcleanfield!==undefined){
    var q3=d.cfgcleanfield.split('|'), cs2=cfgCleanOf(CFG.model), r2=cs2.rows[q3[0]]||{};
    var f3=q3[1];
    if(f3==='depth') r2.depth=e.target.checked;
    else if(f3==='trig') r2.trig=val;
    else r2[f3]=Number(val)||0;
    cs2.rows[q3[0]]=r2; rerender(); return;
  }
  if(d.cfgcalsilo!==undefined){ CFG.calSilo=val; rerender(); return; }
  if(d.cfgcal!==undefined){
    var q4=d.cfgcal.split('|'), cal=cfgCalOf(CFG.model,CFG.calSilo);
    cal.rows.forEach(function(r){ if(r.lv===Number(q4[0])) r[q4[1]]=Number(val)||0; });
    rerender(); return;
  }
  if(d.cfgcaprole!==undefined){ cfgRemoteOf(CFG.model).role[d.cfgcaprole]=val; rerender(); return; }
  if(d.cfgtaskaction!==undefined){ CFG.taskAction=val; CFG.err=''; CFG.confirmSn=''; rerender(); return; }
  if(d.cfgtasksn!==undefined){ CFG.taskSn=val; CFG.err=''; rerender(); return; }
});
document.addEventListener('input',function(e){
  if(!isDevCfg()) return;
  var d=e.target.dataset;
  if(d.cfgconfirm!==undefined){ CFG.confirmSn=e.target.value; return; }
});

/* 初始路由 */
(function(){
  const h=location.hash.match(/#\/([a-z]+)(?:\/([a-z]+))?(?:\/([a-z]+))?(?:\/([a-z]+))?/);
  /* 兼容旧路由：本地化中心已并入系统设置 */
  if(h && h[1]==='localization'){ h[1]='settings'; }
  /* 兼容旧路由：组件与参数已并入系统设置（含只有一段的 #/params） */
  if(h && h[1]==='params'){ h[1]='settings'; h[2]='brand'; }
  /* 旧分区名 devicecfg 已并入系统设置 */
  if(h && h[1]==='devicecfg'){ h[1]='settings'; }
  /* 型号页已删除，旧链接回到品牌 */
  if(h && h[1]==='settings' && h[2]==='model'){ h[2]='brand'; }
  /* 型号工作台的二级页支持直接打开：#/settings/recipe、#/settings/silo … */
  if(h && h[1]==='settings' && ['overview','comp','recipe','silo','clean','calib','remote'].indexOf(h[2])>=0){
    state.sec='settings'; state.mod='model';
    CFG.mdId=CFG.mdId||CFG.model||'M-WSD1008I'; CFG.model=CFG.mdId;
    CFG.sub=h[2];
    render(); return;
  }
  if(h && SECTIONS[h[1]]){
    const secId=h[1];
    state.sec=secId;
    if(secId==='ops'){ const am=MODULES.filter(function(x){ return x.id==='advanced'; })[0]; state.tab=am?am.tabs[0][0]:null; }
    if(secId==='analytics'){
      if(h[2]==='platform'){
        state.role='root'; state.mod='platform'; state.tab='platform';
        if(h[3]&&ROOT[h[3]]) state.rootRole=h[3];
        if(h[4]&&['country','maker','model','fault','tenants'].indexOf(h[4])>=0) state.rootTab=h[4];
        render(); return;
      }
      const mod=MODULES.some(m=>m.id===h[2])?h[2]:'overview';
      const m=MODULES.find(x=>x.id===mod);
      state.mod=mod;
      state.tab=h[3]&&m.tabs.some(t=>t[0]===h[3])?h[3]:m.tabs[0][0];
      render(); return;
    }
    const sec=SECTIONS[secId];
    const extraMods=secId==='settings'?['matrix']:[];
    /* 机器模板 / 机型模板 → 系统设置 · 品牌与型号 */
    if(secId==='machine'&&(h[2]==='template'||h[2]==='brand')){ state.sec='settings'; state.mod='brand'; render(); return; }
    if(secId==='machine'&&h[2]==='component'){ state.sec='settings'; state.mod='component'; render(); return; }
    state.mod=(sec.subs.some(s=>s.id===h[2])||extraMods.indexOf(h[2])>=0)?h[2]:sec.subs[0].id;
    render(); return;
  }
  state.sec='analytics'; state.mod='overview'; state.tab='sales';
  render();
})();
</script>
