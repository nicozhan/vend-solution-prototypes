<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>登录 · JPGK 运营</title>
<link rel="stylesheet" href="app-ui.css">
<style>
/* App 登录页 · 对应 mobile/src/pages/login/index.vue · 页面前缀 la- */
.la-body{
  flex:1;display:flex;flex-direction:column;
  padding:8px 24px 20px;background:var(--surface);overflow-y:auto
}

/* 语言切换胶囊 */
.la-langrow{display:flex;justify-content:flex-end;position:relative;z-index:5;margin-bottom:4px}
.la-lang{
  display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 12px;
  border-radius:999px;background:#e7ebff;color:#111827
}
.la-lang:active{background:#dbe1ff}
.la-flag{
  width:24px;height:20px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:17px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif
}
.la-langtext{font-size:15px;line-height:20px;font-weight:600}
.la-chev{
  width:7px;height:7px;margin-top:-4px;flex:0 0 auto;
  border:solid var(--brand);border-width:0 2px 2px 0;transform:rotate(45deg)
}
.la-langmenu{
  position:absolute;right:0;top:calc(100% + 6px);z-index:60;min-width:176px;padding:5px;
  display:none;border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);
  box-shadow:0 14px 34px rgba(11,16,47,.16)
}
.la-langmenu.open{display:block}
.la-langitem{
  width:100%;min-height:42px;padding:0 11px;display:flex;align-items:center;gap:9px;
  border-radius:var(--r-sm);font-size:14px;color:var(--ink);text-align:left
}
.la-langitem:hover{background:var(--surface-2)}
.la-langitem.on{color:var(--brand);font-weight:700;background:var(--brand-weak)}
.la-langitem .fl{
  width:20px;flex:0 0 auto;text-align:center;font-size:16px;line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif
}
.la-langitem .lb{flex:1;min-width:0;white-space:nowrap}
.la-langitem .ck{width:15px;height:15px;flex:0 0 auto;visibility:hidden}
.la-langitem.on .ck{visibility:visible}

/* 品牌区 */
.la-brand{display:flex;flex-direction:column;align-items:center}
.la-logo{width:213px;height:104px;margin-bottom:8px;object-fit:contain}
.la-head{width:100%;text-align:center;margin-bottom:8px}
.la-title{font-size:30px;line-height:1.25;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
.la-sub{margin-top:8px;font-size:14px;line-height:20px;color:var(--text-2)}

/* 表单 */
.la-form{width:100%;max-width:346px;margin:0 auto;padding-top:36px}
.la-field{
  display:flex;align-items:center;gap:12px;min-height:56px;padding:0 17px;margin-bottom:16px;
  border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface)
}
.la-field:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(36,52,200,.10)}
.la-field .ico{width:20px;height:20px;flex:0 0 auto;object-fit:contain;opacity:.9}
.la-input{
  flex:1;min-width:0;height:54px;border:0;outline:0;background:transparent;
  font-size:16px;color:var(--ink)
}
.la-input::placeholder{color:var(--text-2);font-size:16px}
.la-eye{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.la-eye img{width:20px;height:20px}

/* 图形验证码 */
.la-caprow{display:flex;align-items:center;gap:12px}
.la-capimg{
  width:110px;height:40px;flex:0 0 auto;border-radius:10px;background:#f5f6f8;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-2)
}
.la-capimg canvas{display:block;width:110px;height:40px}

/* 记住我 */
.la-remember{
  width:100%;display:flex;align-items:center;gap:10px;padding:14px 0 18px;min-height:52px;
  background:none;border:0;text-align:left;cursor:pointer
}
.la-check{
  position:relative;width:21px;height:21px;flex:0 0 auto;border-radius:7px;
  background:#fff;border:1.5px solid #c7cdec;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 2px rgba(11,16,47,.05);
  transition:background .16s ease,border-color .16s ease,box-shadow .16s ease,transform .1s ease
}
.la-check svg{
  width:13px;height:13px;color:#fff;opacity:0;transform:scale(.55);
  transition:opacity .12s ease,transform .18s cubic-bezier(.2,.9,.3,1.25)
}
.la-remember[aria-checked="true"] .la-check{
  background:var(--brand);border-color:var(--brand);box-shadow:0 2px 6px rgba(36,52,200,.30)
}
.la-remember[aria-checked="true"] .la-check svg{opacity:1;transform:scale(1)}
.la-remember:active .la-check{transform:scale(.9)}
.la-remember:focus-visible{outline:none}
.la-remember:focus-visible .la-check{box-shadow:0 0 0 3px rgba(36,52,200,.18)}
.la-remember span.la-retext{font-size:14px;line-height:20px;font-weight:600;color:var(--ink)}

.la-submit{
  width:100%;height:56px;border-radius:var(--r-ctl);background:var(--brand);color:#fff;
  font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px
}
.la-submit:active{background:var(--brand-deep)}
.la-submit[disabled]{opacity:.6;cursor:not-allowed}
.la-spin{
  width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
  animation:la-spin .7s linear infinite
}
@keyframes la-spin{to{transform:rotate(360deg)}}

/* 底部 */
.la-footer{width:100%;max-width:346px;margin:auto auto 0;padding-top:32px;text-align:center}
.la-legal{font-size:14px;line-height:24px;color:var(--text-2);max-width:268px;margin:0 auto}
.la-legal button{
  font-size:14px;font-weight:700;color:var(--brand);line-height:24px;
  display:inline;padding:0;background:none;border:0;vertical-align:baseline
}
.la-version{display:block;margin-top:32px;font-size:12px;font-weight:600;letter-spacing:2.16px;color:var(--text-2)}
</style>
</head>
<body>
<main class="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <div class="la-body">

    <div class="la-langrow">
      <button class="la-lang" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="la-flag" id="langFlag" aria-hidden="true">🇨🇳</span>
        <span class="la-langtext" id="langLabel">中文</span>
        <span class="la-chev"></span>
      </button>
      <div class="la-langmenu" id="langMenu" role="menu">
        <button class="la-langitem" type="button" role="menuitem" data-code="zh-CN" aria-label="中文（简体），中国"><span class="fl" aria-hidden="true">🇨🇳</span><span class="lb">中文（简体）</span><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
        <button class="la-langitem" type="button" role="menuitem" data-code="en" aria-label="English，United Kingdom"><span class="fl" aria-hidden="true">🇬🇧</span><span class="lb">English</span><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
        <button class="la-langitem" type="button" role="menuitem" data-code="vi-VN" aria-label="Tiếng Việt，Việt Nam"><span class="fl" aria-hidden="true">🇻🇳</span><span class="lb">Tiếng Việt</span><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
        <button class="la-langitem" type="button" role="menuitem" data-code="zh-TW" aria-label="中文（繁體），中国香港"><span class="fl" aria-hidden="true">🇭🇰</span><span class="lb">中文（繁體）</span><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
      </div>
    </div>

    <div class="la-brand">
      <img class="la-logo" src="assets/brand/logo.png" alt="JPGK">
      <div class="la-head">
        <div class="la-title" id="tTitle">欢迎回来</div>
        <div class="la-sub" id="tSub">登录后继续管理你的智能售卖业务</div>
      </div>
    </div>

    <div class="la-form">
      <div class="la-field">
        <img class="ico" src="assets/brand/icon-email.png" alt="">
        <input class="la-input" id="email" type="text" autocomplete="username" placeholder="Email">
      </div>

      <div class="la-field">
        <img class="ico" src="assets/brand/icon-lock.png" alt="">
        <input class="la-input" id="password" type="password" autocomplete="current-password" placeholder="密码">
        <button class="la-eye" id="eyeBtn" type="button" aria-label="显示密码">
          <img id="eyeIcon" src="assets/brand/icon-eye.png" alt="">
        </button>
      </div>

      <div class="la-field">
        <input class="la-input" id="captcha" type="text" inputmode="text" maxlength="4" autocomplete="off" placeholder="验证码">
        <button class="la-capimg" id="capBtn" type="button" aria-label="刷新验证码">
          <canvas id="capCanvas" width="110" height="40"></canvas>
        </button>
      </div>

      <button class="la-remember" id="remember" type="button" role="checkbox" aria-checked="true">
        <span class="la-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></span>
        <span class="la-retext" id="tRemember">记住登录状态</span>
      </button>

      <button class="la-submit" id="submit" type="button"><span id="tSubmit">登录</span></button>
    </div>

    <div class="la-footer">
      <div class="la-legal">
        <span id="tAgreePrefix">登录即表示同意</span><button type="button" id="terms">《用户协议》</button><span id="tAgreeAnd">和</span><button type="button" id="privacy">《隐私政策》</button>
      </div>
      <span class="la-version" id="tVersion">Version 0.1.0</span>
    </div>

  </div>

  <div class="toast" id="toast"></div>
</main>

<script>
(function(){
  var I18N = {
    'zh-CN': {
      welcome:'欢迎回来', subtitle:'登录后继续管理你的智能售卖业务',
      email:'Email', password:'密码', captcha:'验证码', refresh:'点击刷新',
      remember:'记住登录状态', submit:'登录', loading:'登录中…',
      agreePrefix:'登录即表示同意', agreement:'《用户协议》', agreeAnd:'和', privacy:'《隐私政策》',
      version:'Version 0.1.0',
      needEmail:'请输入账号', needPassword:'请输入密码', needCaptcha:'请输入验证码',
      wrongCaptcha:'验证码不正确', title:'登录 · JPGK 运营', short:'中文'
    },
    'en': {
      welcome:'Welcome back', subtitle:'Manage your unattended retail operations.',
      email:'Email', password:'Password', captcha:'Captcha', refresh:'Tap to refresh',
      remember:'Keep me signed in', submit:'Sign in', loading:'Signing in…',
      agreePrefix:'By signing in, you agree to our ', agreement:'Terms of Service', agreeAnd:' and ', privacy:'Privacy Policy.',
      version:'Version 0.1.0',
      needEmail:'Enter your account', needPassword:'Enter your password', needCaptcha:'Enter the verification code',
      wrongCaptcha:'Incorrect verification code', title:'Sign in · JPGK Ops', short:'English'
    },
    'vi-VN': {
      welcome:'Chào mừng trở lại', subtitle:'Quản lý hoạt động bán lẻ tự động của bạn.',
      email:'Email', password:'Mật khẩu', captcha:'Mã xác minh', refresh:'Nhấn để làm mới',
      remember:'Duy trì đăng nhập', submit:'Đăng nhập', loading:'Đang đăng nhập…',
      agreePrefix:'Khi đăng nhập, bạn đồng ý với ', agreement:'Điều khoản dịch vụ', agreeAnd:' và ', privacy:'Chính sách quyền riêng tư.',
      version:'Phiên bản 0.1.0',
      needEmail:'Vui lòng nhập tài khoản', needPassword:'Vui lòng nhập mật khẩu', needCaptcha:'Vui lòng nhập mã xác minh',
      wrongCaptcha:'Mã xác minh không đúng', title:'Đăng nhập · JPGK', short:'Tiếng Việt'
    },
    'zh-TW': {
      welcome:'歡迎回來', subtitle:'登錄後繼續管理你的智能售賣業務',
      email:'Email', password:'密碼', captcha:'驗證碼', refresh:'點擊刷新',
      remember:'記住登錄狀態', submit:'登錄', loading:'登錄中…',
      agreePrefix:'登錄即表示同意', agreement:'《用戶協議》', agreeAnd:'和', privacy:'《隱私政策》',
      version:'Version 0.1.0',
      needEmail:'請輸入帳號', needPassword:'請輸入密碼', needCaptcha:'請輸入驗證碼',
      wrongCaptcha:'驗證碼不正確', title:'登錄 · JPGK 運營', short:'繁體'
    }
  };
  var HTML_LANG = { 'zh-CN':'zh-CN', 'en':'en', 'vi-VN':'vi', 'zh-TW':'zh-Hant' };
  /* 语言对应的国家 / 地区旗（繁體中文按中国香港标注） */
  var FLAG = { 'zh-CN':'🇨🇳', 'en':'🇬🇧', 'vi-VN':'🇻🇳', 'zh-TW':'🇭🇰' };

  var el = function(id){ return document.getElementById(id); };
  var lang = localStorage.getItem('vs_lang') || 'zh-CN';
  if(!I18N[lang]) lang = 'zh-CN';

  var email = el('email'), password = el('password'), captcha = el('captcha');
  var submit = el('submit'), remember = el('remember');
  var currentCode = '';
  var loading = false;

  /* ---------- 文案 ---------- */
  function applyLang(code){
    var d = I18N[code];
    lang = code;
    el('tTitle').textContent = d.welcome;
    el('tSub').textContent = d.subtitle;
    email.placeholder = d.email;
    password.placeholder = d.password;
    captcha.placeholder = d.captcha;
    el('tRemember').textContent = d.remember;
    el('tSubmit').textContent = loading ? d.loading : d.submit;
    el('tAgreePrefix').textContent = d.agreePrefix;
    el('terms').textContent = d.agreement;
    el('tAgreeAnd').textContent = d.agreeAnd;
    el('privacy').textContent = d.privacy;
    el('tVersion').textContent = d.version;
    el('langLabel').textContent = d.short;
    el('langFlag').textContent = FLAG[code] || '';
    document.documentElement.lang = HTML_LANG[code];
    document.title = d.title;
    Array.prototype.forEach.call(document.querySelectorAll('.la-langitem'), function(it){
      it.classList.toggle('on', it.dataset.code === code);
    });
    el('langMenu').classList.remove('open');
    el('langBtn').setAttribute('aria-expanded','false');
    localStorage.setItem('vs_lang', code);
  }

  /* ---------- toast ---------- */
  var toastTimer = null;
  function toast(msg){
    var t = el('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  /* ---------- 图形验证码 ---------- */
  var CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function randomCode(){
    var s = '';
    for(var i=0;i<4;i++){ s += CHARS.charAt(Math.floor(Math.random()*CHARS.length)); }
    return s;
  }
  function drawCaptcha(){
    currentCode = randomCode();
    var cv = el('capCanvas'), ctx = cv.getContext('2d');
    var w = cv.width, h = cv.height;
    ctx.clearRect(0,0,w,h);
    var grd = ctx.createLinearGradient(0,0,w,h);
    grd.addColorStop(0,'#eef1ff');
    grd.addColorStop(1,'#f7f8fc');
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,w,h);

    /* 干扰线 */
    for(var i=0;i<4;i++){
      ctx.beginPath();
      ctx.strokeStyle = ['#c7cdf5','#b7c0f0','#d9d3f0'][i%3];
      ctx.lineWidth = 1;
      ctx.moveTo(Math.random()*w, Math.random()*h);
      ctx.lineTo(Math.random()*w, Math.random()*h);
      ctx.stroke();
    }
    /* 干扰点 */
    for(var j=0;j<26;j++){
      ctx.fillStyle = 'rgba(90,104,180,.28)';
      ctx.beginPath();
      ctx.arc(Math.random()*w, Math.random()*h, 0.9, 0, Math.PI*2);
      ctx.fill();
    }
    /* 字符 */
    ctx.textBaseline = 'middle';
    for(var k=0;k<currentCode.length;k++){
      var ch = currentCode.charAt(k);
      ctx.save();
      ctx.translate(16 + k*24, h/2 + (Math.random()*6-3));
      ctx.rotate((Math.random()-0.5)*0.5);
      ctx.font = '700 22px "Helvetica Neue", Arial, sans-serif';
      ctx.fillStyle = ['#2434c8','#5b3fd6','#1f3fa8','#3b2fa0'][k%4];
      ctx.fillText(ch, -8, 0);
      ctx.restore();
    }
  }

  /* ---------- 密码明暗文 ---------- */
  el('eyeBtn').addEventListener('click', function(){
    var show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    el('eyeIcon').src = show ? 'assets/brand/icon-eye-close.png' : 'assets/brand/icon-eye.png';
    el('eyeBtn').setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
  });

  /* ---------- 语言切换 ---------- */
  el('langBtn').addEventListener('click', function(e){
    e.stopPropagation();
    var m = el('langMenu');
    var open = m.classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  el('langMenu').addEventListener('click', function(e){
    var it = e.target.closest('.la-langitem');
    if(!it) return;
    applyLang(it.dataset.code);
  });
  document.addEventListener('click', function(){
    el('langMenu').classList.remove('open');
    el('langBtn').setAttribute('aria-expanded','false');
  });

  /* ---------- 记住登录状态 ---------- */
  remember.addEventListener('click', function(){
    var on = remember.getAttribute('aria-checked') === 'true';
    remember.setAttribute('aria-checked', on ? 'false' : 'true');
    localStorage.setItem('vs_remember', on ? '0' : '1');
  });
  if(localStorage.getItem('vs_remember') === '0'){
    remember.setAttribute('aria-checked','false');
  }

  /* ---------- 登录 ---------- */
  function setLoading(next){
    loading = next;
    submit.disabled = next;
    submit.innerHTML = next
      ? '<span class="la-spin"></span><span id="tSubmit">' + I18N[lang].loading + '</span>'
      : '<span id="tSubmit">' + I18N[lang].submit + '</span>';
  }

  function onSubmit(){
    if(loading) return;
    var d = I18N[lang];
    if(!email.value.trim()){ toast(d.needEmail); email.focus(); return; }
    if(!password.value.trim()){ toast(d.needPassword); password.focus(); return; }
    var code = captcha.value.trim().toUpperCase();
    if(!code){ toast(d.needCaptcha); captcha.focus(); return; }
    if(code !== currentCode){
      toast(d.wrongCaptcha);
      captcha.value = '';
      drawCaptcha();
      captcha.focus();
      return;
    }
    if(localStorage.getItem('vs_remember') !== '0'){
      localStorage.setItem('vs_remembered_email', email.value.trim());
    } else {
      localStorage.removeItem('vs_remembered_email');
    }
    setLoading(true);
    setTimeout(function(){
      setLoading(false);
      location.href = 'navigation.html';
    }, 800);
  }

  submit.addEventListener('click', onSubmit);
  el('capBtn').addEventListener('click', function(e){ e.stopPropagation(); drawCaptcha(); captcha.value = ''; });
  [email, password, captcha].forEach(function(input){
    input.addEventListener('keydown', function(e){ if(e.key === 'Enter') onSubmit(); });
  });
  el('terms').addEventListener('click', function(){ toast('用户协议（演示占位）'); });
  el('privacy').addEventListener('click', function(){ toast('隐私政策（演示占位）'); });

  /* ---------- 初始化 ---------- */
  var savedEmail = localStorage.getItem('vs_remembered_email');
  if(savedEmail && localStorage.getItem('vs_remember') !== '0'){ email.value = savedEmail; }
  applyLang(lang);
  drawCaptcha();
})();
</script>
</body>
</html>
