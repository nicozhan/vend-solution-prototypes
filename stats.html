<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>统计 · VendSolution</title>
<link rel="stylesheet" href="app-ui.css">
<style>
/* 统计 · 总览（方案 C1） · 页面前缀 st- */
.st-body{position:relative;padding:0 16px 18px}
.st-sticky{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:8px;margin:0 -16px 8px;padding:8px 16px;background:var(--bg)}
.st-sticky .segmented{flex:1}
.st-sticky .segmented button{height:32px;font-size:12.5px}
.st-refresh{width:40px;height:40px;flex:0 0 auto;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text-2);display:flex;align-items:center;justify-content:center}
.st-refresh:active{background:var(--surface-2)}
.st-refresh.spin svg{animation:stspin .8s linear infinite}
@keyframes stspin{to{transform:rotate(360deg)}}

/* KPI */
.st-hero{padding:14px;border-radius:var(--r-card);background:linear-gradient(145deg,#2c3cd6 0%,#1b299e 100%);color:#fff;box-shadow:0 10px 24px rgba(27,41,158,.22)}
.st-hero-lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;line-height:16px;font-weight:600;color:rgba(255,255,255,.7)}
.st-hero-num{margin-top:4px;font-size:31px;line-height:36px;font-weight:800;letter-spacing:-1.2px;font-variant-numeric:tabular-nums}
.st-hero-num.empty{font-size:22px;line-height:32px;font-weight:700;opacity:.7;letter-spacing:0}
.st-delta{display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 8px;border-radius:999px;background:rgba(255,132,120,.2);color:#ffd9d3;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.st-delta.dn{background:rgba(120,226,180,.18);color:#b7f0da}
.st-hero-dlt{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:11px;color:rgba(255,255,255,.6);font-weight:600}
.st-cells{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.16)}
.st-cell{padding-left:10px;border-left:1px solid rgba(255,255,255,.13)}
.st-cell:first-child{padding-left:0;border-left:0}
.st-cell span{display:block;font-size:10px;line-height:14px;font-weight:600;color:rgba(255,255,255,.55)}
.st-cell b{display:block;margin-top:2px;font-size:15px;line-height:20px;font-weight:800;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
.st-note{margin-top:9px;font-size:9.5px;line-height:14px;color:rgba(255,255,255,.45)}

.st-today{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.st-today .l{font-size:12px;font-weight:700}
.st-today .l em{display:block;margin-top:1px;font-style:normal;font-size:10px;line-height:14px;font-weight:500;color:var(--text-3)}
.st-today .v{text-align:right}
.st-today .v b{display:block;font-size:15px;line-height:20px;font-weight:800;font-variant-numeric:tabular-nums}
.st-today .v i{display:block;margin-top:1px;font-style:normal;font-size:10px;line-height:14px;font-weight:600;color:var(--text-2)}

/* 卡片通用头 */
.st-card{padding:12px 14px 6px}
.st-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:9px}
.st-hd h2{font-size:15px;line-height:21px;font-weight:700;letter-spacing:-.1px}
.st-hd-note{font-size:10px;font-weight:600;color:var(--text-3)}
.st-more{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--brand);white-space:nowrap}

/* 排行 */
.st-tabs{margin-bottom:2px}
.st-tabs button{height:30px;font-size:12px}
.st-rk{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.st-rk:last-child{border-bottom:0}
.st-no{width:20px;height:20px;border-radius:6px;background:var(--surface-2);color:var(--text-2);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.st-no.t1{background:var(--brand);color:#fff}
.st-no.t2{background:#e2e6fb;color:#33409e}
.st-no.t3{background:#edf0f7;color:#5b6488}
.st-rk-main{min-width:0}
.st-rk-line{display:flex;align-items:baseline;gap:6px;min-width:0}
.st-rk-line b{flex:0 1 auto;min-width:0;font-size:12.5px;line-height:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-rk-line i{flex:0 0 auto;font-style:normal;font-size:9.5px;line-height:14px;font-weight:600;color:var(--text-3)}
.st-bar{display:block;height:4px;margin-top:5px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.st-bar i{display:block;height:100%;border-radius:2px;background:var(--brand);opacity:.85}
.st-rk-val{text-align:right}
.st-rk-val b{display:block;font-size:12.5px;line-height:17px;font-weight:700;font-variant-numeric:tabular-nums}
.st-rk-val em{display:block;margin-top:1px;font-style:normal;font-size:9.5px;line-height:14px;font-weight:600;color:var(--text-3);font-variant-numeric:tabular-nums}
.st-card-foot{padding:7px 0 4px;font-size:10px;line-height:15px;color:var(--text-3)}

/* 资产入口 */
.st-asset{display:flex;align-items:center;gap:12px;padding:12px 14px}
.st-asset-main{min-width:0;flex:1}
.st-asset-hd{font-size:13px;font-weight:700}
.st-asset-vals{display:flex;gap:13px;margin-top:5px}
.st-asset-vals span{font-size:10px;font-weight:600;color:var(--text-2);white-space:nowrap}
.st-asset-vals b{margin-right:2px;font-size:13px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}

/* 现场待办 */
.st-todo-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto 14px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);color:inherit}
.st-todo-row:last-of-type{border-bottom:0}
.st-ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text-2);font-size:12px;font-weight:800}
.st-ico.warn{background:var(--warn-bg);color:var(--warn)}
.st-ico.brand{background:var(--brand-weak);color:var(--brand)}
.st-todo-main{min-width:0}
.st-todo-main b{display:block;font-size:12.5px;line-height:17px;font-weight:600}
.st-todo-main em{display:block;margin-top:1px;font-style:normal;font-size:10px;line-height:15px;color:var(--text-2)}
.st-todo-val{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.st-prog{display:block;height:4px;margin-top:5px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.st-prog i{display:block;height:100%;border-radius:2px;background:var(--brand)}
.st-diff{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
.st-diff div{padding:8px 6px;border-radius:10px;background:var(--surface-2);text-align:center}
.st-diff b{display:block;font-size:16px;line-height:21px;font-weight:800;font-variant-numeric:tabular-nums}
.st-diff span{display:block;margin-top:1px;font-size:9.5px;line-height:14px;font-weight:600;color:var(--text-2)}
.st-up{color:var(--danger)}
.st-dn{color:var(--ok)}
.st-sub-hd{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.3px;color:var(--text-2)}
.st-diff-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:12.5px}
.st-diff-row span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-diff-row b{font-weight:800;font-variant-numeric:tabular-nums}

/* 脚注 */
.st-foot{margin-top:12px;padding:0 2px;font-size:10px;line-height:16px;color:var(--text-3)}

/* 骨架 / 错误 / 空 */
.st-sk{display:flex;flex-direction:column;gap:8px}
.st-sk i{display:block;border-radius:12px;background:var(--surface-2);animation:stpulse 1.1s ease-in-out infinite}
@keyframes stpulse{0%,100%{opacity:.55}50%{opacity:1}}
.st-err{padding:30px 16px;text-align:center}
.st-err p{font-size:13px;font-weight:600}
.st-err span{display:block;margin-top:4px;font-size:11px;line-height:16px;color:var(--text-2)}
.st-err .btn{margin-top:14px}
</style>
</head>
<body>
<main class="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <span class="nav-left">
      <button class="icon-btn" type="button" aria-label="返回常用" onclick="appHome(event,'common')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </span>
    <h1>统计</h1>
    <span class="nav-right">
      <a class="icon-btn accent" href="stats-fleet.html" aria-label="资产与机队">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="7" rx="2"/><rect x="14" y="4" width="7" height="7" rx="2"/><rect x="3" y="13" width="7" height="7" rx="2"/><rect x="14" y="13" width="7" height="7" rx="2"/></svg>
      </a>
    </span>
  </header>

  <div class="body st-body" id="stBody">
    <div class="st-sticky">
      <div class="segmented" id="stPeriod" role="tablist" aria-label="统计时间范围">
        <button type="button" data-p="today" role="tab">今日</button>
        <button type="button" data-p="d7" role="tab" class="active">近 7 天</button>
        <button type="button" data-p="d30" role="tab">近 30 天</button>
      </div>
      <button class="st-refresh" type="button" data-act="refresh" aria-label="刷新数据">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.6 5.9"/><path d="M20 4.5V11h-6.4"/></svg>
      </button>
    </div>

    <div id="stContent"></div>
    <div class="st-foot" id="stFoot"></div>
  </div>

  <div class="toast" id="stToast" role="status" aria-live="polite"></div>
</main>

<script src="app-ui.js"></script>
<script src="stats-data.js"></script>
<script>
(function(){
  var S=window.STATS;
  var body=document.getElementById('stBody');
  var content=document.getElementById('stContent');
  var foot=document.getElementById('stFoot');
  var params=new URLSearchParams(location.search);
  var demo=(params.get('state')||'').toLowerCase();
  var period=S.PERIODS[params.get('p')]?params.get('p'):'d7';
  var tab=['products','sites','devices'].indexOf(params.get('dim'))>=0?params.get('dim'):'products';
  var TAB_UNIT={products:'个商品',sites:'个点位',devices:'台设备'};

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
  function toast(msg){
    var el=document.getElementById('stToast');
    el.textContent=msg; el.classList.add('show');
    clearTimeout(toast._t); toast._t=setTimeout(function(){el.classList.remove('show')},1900);
  }
  function money1(n){return '¥'+(Math.round(n*10)/10).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1})}
  function arrow(up){
    return up
      ? '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 15 7-7 7 7"/></svg>'
      : '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 9 7 7 7-7"/></svg>';
  }

  /* ---------- M01 / M02 / M03 / M06 + M05（日均） ---------- */
  function heroHTML(per,empty){
    var aov=per.total/per.orders;
    var avg=per.days===1?S.PERIODS.d7.total/7:per.total/per.days;
    var d=S.delta(per.total,per.prevTotal), up=d>=0;
    var dlt=empty
      ? '<span class="st-delta" style="background:rgba(255,255,255,.14);color:rgba(255,255,255,.72)">—</span><span>该时段暂无订单</span>'
      : '<span class="st-delta'+(up?'':' dn')+'">'+arrow(up)+Math.abs(d).toFixed(1)+'%</span><span>'+esc(per.prevLabel)+' '+S.money(per.prevTotal)+'</span>';
    return '<div class="st-hero">'
      +'<div class="st-hero-lbl"><span>销售额 · '+esc(per.range)+'（CNY）</span><span>'+(empty?'—':'实时')+'</span></div>'
      +'<div class="st-hero-num'+(empty?' empty':'')+'">'+(empty?'—':S.money(per.total))+'</div>'
      +'<div class="st-hero-dlt">'+dlt+'</div>'
      +'<div class="st-cells">'
      +'<div class="st-cell"><span>订单数</span><b>'+(empty?'—':S.num(per.orders))+'</b></div>'
      +'<div class="st-cell"><span>客单价</span><b>'+(empty?'—':money1(aov))+'</b></div>'
      +'<div class="st-cell"><span>'+(per.days===1?'近 7 天日均':'日均销售')+'</span><b>'+(empty?'—':S.money(avg))+'</b></div>'
      +'</div>'
      +'<div class="st-note">'+(per.days===1?'今日只统计当天，日均一列取近 7 天作参考':'日均 = 区间合计 ÷ '+per.days+' 天 · 客单价 = 金额 ÷ 订单数')+'</div>'
      +'</div>';
  }

  /* ---------- M04 今日（不受筛选影响） ---------- */
  function todayHTML(per){
    if(per.days===1){
      return '<div class="st-today">'
        +'<span class="l">昨日同期<em>与今日同一时段对比</em></span>'
        +'<span class="v"><b>'+S.money(per.prevTotal)+'</b><i>'+S.num(per.prevOrders)+' 单</i></span>'
        +'</div>';
    }
    return '<div class="st-today">'
      +'<span class="l">今日<em>不受时间筛选影响</em></span>'
      +'<span class="v"><b>'+S.money(S.TODAY.amount)+'</b><i>'+S.num(S.TODAY.orders)+' 单</i></span>'
      +'</div>';
  }

  /* ---------- M17 / M18 / M19 / M20 / M23 ---------- */
  function rankRow(item,i,max){
    var tone=i===0?' t1':i===1?' t2':i===2?' t3':'';
    var sub=item.sub?'<i>'+esc(item.sub)+'</i>':'';
    return '<div class="st-rk">'
      +'<span class="st-no'+tone+'">'+(i+1)+'</span>'
      +'<span class="st-rk-main"><span class="st-rk-line"><b>'+esc(item.name)+'</b>'+sub+'</span>'
      +'<span class="st-bar"><i style="width:'+(max?item.amount/max*100:0).toFixed(1)+'%"></i></span></span>'
      +'<span class="st-rk-val"><b>'+S.money(item.amount)+'</b><em>'+item.share.toFixed(1)+'%</em></span>'
      +'</div>';
  }
  function rankHTML(per){
    var all=S.ranks(per.key)[tab];
    var rows=all.slice(0,10);
    var max=all.length?all[0].amount:0;
    return '<section class="card st-card st-rank">'
      +'<div class="st-hd"><h2>销售额排行</h2>'
      +'<a class="st-more" href="stats-rank.html?p='+per.key+'&amp;dim='+tab+'">全部 '+all.length+' 条 ›</a></div>'
      +'<div class="segmented st-tabs" id="stTabs">'
      +'<button type="button" data-tab="products" class="'+(tab==='products'?'active':'')+'">商品</button>'
      +'<button type="button" data-tab="sites" class="'+(tab==='sites'?'active':'')+'">点位</button>'
      +'<button type="button" data-tab="devices" class="'+(tab==='devices'?'active':'')+'">设备</button>'
      +'</div>'
      +rows.map(function(item,i){return rankRow(item,i,max)}).join('')
      +'<div class="st-card-foot">展示前 '+rows.length+' 名 · 共 '+all.length+' '+TAB_UNIT[tab]+' · 按区间销售额降序</div>'
      +'</section>';
  }

  /* ---------- G4 摘要入口 ---------- */
  function assetHTML(){
    var a=S.assets();
    return '<a class="card st-asset" href="stats-fleet.html">'
      +'<span class="st-asset-main"><span class="st-asset-hd">资产与机队</span>'
      +'<span class="st-asset-vals">'
      +'<span><b>'+a.deviceTotal+'</b>设备</span>'
      +'<span><b>'+a.deviceActive+'</b>在用</span>'
      +'<span><b>'+a.siteTotal+'</b>点位</span>'
      +'<span><b>'+a.productOnShelf+'</b>在售</span>'
      +'</span></span>'
      +'<svg class="item-go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>'
      +'</a>';
  }

  /* ---------- M32 / M35 / M36 / M37 ---------- */
  function todoHTML(){
    var t=S.TODO, pct=t.checkedDevices/t.planDevices*100;
    return '<section class="card st-card">'
      +'<div class="st-hd"><h2>现场待办</h2><span class="st-hd-note">仅本机记录</span></div>'
      +'<a class="st-todo-row" href="product-list.html">'
        +'<span class="st-ico warn">!</span>'
        +'<span class="st-todo-main"><b>缺货商品</b><em>'+t.lowStockProducts+' 个商品低于安全库存</em></span>'
        +'<span class="st-todo-val st-up">'+t.lowStockProducts+' 个</span>'
        +'<svg class="item-go" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>'
      +'</a>'
      +'<div class="st-todo-row">'
        +'<span class="st-ico brand">✓</span>'
        +'<span class="st-todo-main"><b>今日盘点</b><em>计划 '+t.planDevices+' 台 · 已盘 '+t.checkedDevices+' 台</em>'
          +'<span class="st-prog"><i style="width:'+pct.toFixed(0)+'%"></i></span></span>'
        +'<span class="st-todo-val">'+t.checkedDevices+'/'+t.planDevices+'</span>'
        +'<span></span>'
      +'</div>'
      +'<div class="st-diff">'
        +'<div><b class="st-up">+'+t.diffIn+'</b><span>盘盈件</span></div>'
        +'<div><b class="st-dn">−'+Math.abs(t.diffOut)+'</b><span>盘亏件</span></div>'
        +'<div><b>+'+(t.diffIn+t.diffOut)+'</b><span>净差异</span></div>'
      +'</div>'
      +'<div class="st-card-foot" style="padding:0">来自 '+t.checkedDevices+' 台设备的盘点结果</div>'
      +'<div class="st-sub-hd">差异 TOP 商品</div>'
      +t.diffTop.map(function(d){
        var up=d.diff>0;
        return '<div class="st-diff-row"><span>'+esc(d.name)+'</span>'
          +'<b class="'+(up?'st-up':'st-dn')+'">'+(up?'+':'−')+Math.abs(d.diff)+' 件</b></div>';
      }).join('')
      +'<div class="st-card-foot">按商品名跨设备累计 · 找「总也对不上」的 SKU</div>'
      +'</section>';
  }

  function emptyCardHTML(){
    return '<div class="card st-err" style="padding:26px 16px">'
      +'<div style="margin:0 auto 10px;width:44px;height:44px;border-radius:14px;background:var(--surface-2);color:var(--text-3);display:flex;align-items:center;justify-content:center">'
      +'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-6M22 19H2"/></svg></div>'
      +'<p>该时段没有订单数据</p><span>换成「近 7 天」或「近 30 天」，或等待设备数据同步</span>'
      +'</div>';
  }

  function render(per){
    if(demo==='empty')return heroHTML(per,true)+emptyCardHTML()+assetHTML();
    return heroHTML(per,false)+todayHTML(per)+rankHTML(per)+assetHTML()+todoHTML();
  }

  function footHTML(){
    return '数据按租户时区归日 · 金额为订单实付<br>含租户全部设备订单（含咖啡机）· 排行按区间销售额降序';
  }

  function skeletonHTML(){
    return '<div class="st-sk">'
      +'<i style="height:152px"></i>'
      +'<i style="height:56px"></i>'
      +'<i style="height:286px"></i>'
      +'<i style="height:64px"></i>'
      +'<i style="height:240px"></i>'
      +'</div>';
  }

  function errorHTML(){
    return '<div class="card st-err">'
      +'<div style="margin:0 auto 10px;width:44px;height:44px;border-radius:14px;background:var(--surface-2);color:var(--text-3);display:flex;align-items:center;justify-content:center">'
      +'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9"/></svg></div>'
      +'<p>数据加载失败</p><span>网络异常或服务超时，销售额与排行均未取到</span>'
      +'<button class="btn btn-sm btn-secondary" type="button" data-act="retry">重新加载</button>'
      +'</div>';
  }

  function paint(first){
    if(demo==='error'){content.innerHTML=errorHTML();foot.innerHTML='';return}
    var per=S.PERIODS[period];
    content.innerHTML=skeletonHTML();
    setTimeout(function(){
      content.innerHTML=render(per);
      foot.innerHTML=demo==='empty'?'':footHTML();
    },first?420:240);
  }

  /* 时间筛选（M44） */
  document.getElementById('stPeriod').addEventListener('click',function(event){
    var btn=event.target.closest('[data-p]'); if(!btn)return;
    period=btn.dataset.p;
    Array.prototype.forEach.call(this.querySelectorAll('[data-p]'),function(b){
      var on=b===btn; b.classList.toggle('active',on); b.setAttribute('aria-selected',on?'true':'false');
    });
    paint(false);
  });

  /* 排行 Tab（M20）：同一次取数的三组数据，切换只重画排行卡 */
  content.addEventListener('click',function(event){
    var t=event.target.closest('[data-tab]');
    if(t){
      tab=t.dataset.tab;
      var old=content.querySelector('.st-rank');
      if(old)old.outerHTML=rankHTML(S.PERIODS[period]);
      return;
    }
    var act=event.target.closest('[data-act]');
    if(act&&act.dataset.act==='retry'){
      demo='';paint(false);
    }
  });

  /* 刷新（M47） */
  function refresh(fromPull){
    var btn=document.querySelector('.st-refresh');
    if(!fromPull){
      btn.classList.add('spin');
      setTimeout(function(){btn.classList.remove('spin')},900);
    }
    paint(false);
    setTimeout(function(){toast('数据已更新')},620);
  }
  document.querySelector('.st-refresh').addEventListener('click',function(){refresh(false)});

  var sy=0,pull=false;
  body.addEventListener('touchstart',function(e){
    if(body.scrollTop<=0){sy=e.touches[0].clientY;pull=true}
  },{passive:true});
  body.addEventListener('touchend',function(e){
    if(pull&&e.changedTouches[0].clientY-sy>72)refresh(true);
    pull=false;
  },{passive:true});

  paint(true);
})();
</script>
</body>
</html>
